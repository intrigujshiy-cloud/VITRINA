<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тетрадь в клетку - Конструктор</title>
    <style>
        /* Базовые стили */
        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
            background-color: #f4f7f6;
            transition: background 0.3s;
        }

        body.player-bg {
            background-image: url('https://img.genially.com/66f3a31bcd1a12001568ab85/cce83568-9d47-44ec-8078-c96d55f0bab9.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* --- РЕДАКТОР --- */
        #editor-mode {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 2px solid #e0e6ed;
        }
        .editor-row {
            background: #f8faff;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px dashed #c1d5ee;
            border-radius: 12px;
            position: relative;
        }
        .editor-row input[type="text"], .editor-row textarea {
            width: calc(100% - 24px);
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }
        .editor-row textarea {
            resize: vertical;
            min-height: 90px;
            white-space: pre-wrap;
        }
        .hint-text {
            font-size: 13px;
            color: #666;
            margin-top: -5px;
            margin-bottom: 10px;
            display: block;
        }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 8px 12px;
            font-weight: bold;
        }
        .add-btn {
            background: #4facfe;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .save-btn {
            background: #43e97b;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 4px 0 #38c566;
            transition: all 0.3s;
        }
        .save-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        #link-container {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 12px;
            border: 2px solid #ffe69c;
        }
        #generated-link {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ffe69c;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            background: #fff;
        }

        /* --- ПЛЕЕР --- */
        #player-mode {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 4px solid rgba(240, 244, 248, 0.8);
            backdrop-filter: blur(5px);
        }
        
        .task-container {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(253, 253, 253, 0.9);
            border-radius: 16px;
            border-left: 6px solid #4facfe;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .task-condition {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            color: #333;
            line-height: 1.4;
        }
        .task-condition .dot {
            color: #4facfe;
            font-size: 24px;
            line-height: 16px;
            margin-right: 8px;
        }

        /* ТЕТРАДЬ В КЛЕТКУ */
        .notebook-wrapper {
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .notebook-grid {
            display: inline-flex;
            flex-direction: column;
            border-top: 1px solid #7bc6e8;
            border-left: 1px solid #7bc6e8;
            background: #fff;
        }
        .grid-row {
            display: flex;
        }
        .cell {
            width: 28px;
            height: 28px;
            border-right: 1px solid #7bc6e8;
            border-bottom: 1px solid #7bc6e8;
            border-top: none;
            border-left: none;
            outline: none;
            text-align: center;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #0056b3; 
            background: transparent;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .cell:focus {
            background: #e6f7ff;
            box-shadow: inset 0 0 0 2px #007bff;
        }
        .cell.correct {
            background-color: #d4edda;
            color: #155724;
            box-shadow: inset 0 0 0 2px #28a745;
        }
        .cell.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            box-shadow: inset 0 0 0 2px #dc3545;
        }

        /* КНОПКА ПРОВЕРКИ */
        .check-btn {
            background: linear-gradient(180deg, #ffca28 0%, #ff8f00 100%);
            border: none;
            border-bottom: 6px solid #c56000;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            display: block;
            margin: 20px auto 10px auto;
            transition: all 0.1s;
            outline: none;
        }
        .check-btn:active {
            transform: translateY(6px);
            border-bottom: 0px solid #c56000;
            margin-bottom: 16px;
        }

        .edit-trigger {
            display: block;
            margin-top: 20px;
            color: #7b8c9e;
            text-decoration: none;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- РЕДАКТОР -->
    <div id="editor-mode" style="display: none;">
        <h2>📝 Редактор: Тетрадь в клетку</h2>
        <p>Напиши условие и правильные ответы. Ребенок получит сетку 3х22 клетки, в которой сможет писать свои решения.</p>
        
        <div id="questions-list"></div>

        <button class="add-btn" onclick="addEditorRow()">+ Добавить задание</button>
        <button class="save-btn" id="main-save-btn" onclick="generateAndCopyLink()">✨ Сохранить и скопировать iframe для Genially</button>

        <div id="link-container" style="display: none;">
            <p><strong>Код успешно скопирован!</strong> Вставляй его в Genially (Insert -> Other).</p>
            <textarea id="generated-link" rows="4" readonly onclick="this.select()"></textarea>
            <br>
            <a id="preview-link" href="#" target="_blank" style="display: inline-block; margin-top: 10px; color: #4facfe; font-weight: bold;">▶ Открыть игру для проверки</a>
        </div>
    </div>

    <!-- ПЛЕЕР -->
    <div id="player-mode" style="display: none;">
        <div id="exercise-container"></div>
        <button class="check-btn" onclick="checkAnswers()">Проверить</button>
        <a href="#" class="edit-trigger" onclick="forceEditMode(event)">[ Редактировать ]</a>
    </div>
</div>

<script>
    // Предзаполненные данные со всеми возможными перестановками!
    const defaultData = [
        { 
            condition: 'Найди произведение чисел 672 и 15. Представь его в виде суммы двух одинаковых слагаемых.', 
            answers: '672*15=10080 | 15*672=10080 | 10080=672*15 | 10080=15*672\n10080=5040+5040 | 5040+5040=10080' 
        },
        { 
            condition: 'Найди частное чисел 55 338 и 69. Представь его в виде разности трёхзначных чисел.', 
            answers: '55338:69=802 | 802=55338:69\n802=902-100 | 902-100=802 | 802=999-197 | 999-197=802 | 802=952-150 | 952-150=802 | 802=912-110 | 912-110=802' 
        },
        { 
            condition: 'Найди сумму чисел 1 755 и 687. Представь её в виде произведения двух любых множителей.', 
            answers: '1755+687=2442 | 687+1755=2442 | 2442=1755+687 | 2442=687+1755\n2442=2*1221 | 2442=1221*2 | 2*1221=2442 | 1221*2=2442 | 2442=3*814 | 2442=814*3 | 3*814=2442 | 814*3=2442 | 2442=6*407 | 2442=407*6 | 6*407=2442 | 407*6=2442' 
        },
        { 
            condition: 'Найди разность чисел 1 183 и 574. Представь её в виде частного.', 
            answers: '1183-574=609 | 609=1183-574\n609=1218:2 | 1218:2=609 | 609=1827:3 | 1827:3=609 | 609=2436:4 | 2436:4=609 | 609=6090:10 | 6090:10=609' 
        }
    ];

    document.addEventListener("DOMContentLoaded", () => {
        init();
    });

    function init() {
        const hash = window.location.hash;
        if (hash.startsWith('#data=')) {
            try {
                const encodedData = hash.substring(6);
                const jsonStr = decodeURIComponent(escape(atob(encodedData)));
                renderPlayer(JSON.parse(jsonStr));
            } catch (e) {
                renderEditor(defaultData);
            }
        } else {
            renderEditor(defaultData);
        }
    }

    function renderEditor(existingData = null) {
        document.getElementById('editor-mode').style.display = 'block';
        document.getElementById('player-mode').style.display = 'none';
        document.body.classList.remove('player-bg');
        
        const list = document.getElementById('questions-list');
        list.innerHTML = '';

        if (existingData && existingData.length > 0) {
            existingData.forEach(item => addEditorRow(item.condition, item.answers));
        } else {
            addEditorRow();
        }
    }

    function addEditorRow(condition = '', answers = '') {
        const list = document.getElementById('questions-list');
        const row = document.createElement('div');
        row.className = 'editor-row';
        row.innerHTML = `
            <button class="delete-btn" onclick="this.parentElement.remove()">✕</button>
            <input type="text" class="inp-condition" placeholder="Текст условия..." value="${condition}">
            <span class="hint-text">Правильные ответы (каждый с новой строки). Варианты ответа разделены знаком |</span>
            <textarea class="inp-answers" placeholder="Например:&#10;55338:69=802&#10;802=902-100 | 802=999-197">${answers}</textarea>
        `;
        list.appendChild(row);
    }

    async function generateAndCopyLink() {
        const rows = document.querySelectorAll('.editor-row');
        const data = [];
        
        rows.forEach(row => {
            const condition = row.querySelector('.inp-condition').value.trim();
            const answers = row.querySelector('.inp-answers').value.trim();
            if (condition || answers) {
                data.push({ condition, answers });
            }
        });

        const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        const finalUrl = window.location.href.split('#')[0] + '#data=' + b64;
        
        const iframeCode = `<iframe src="${finalUrl}" width="100%" height="100%" style="min-height: 850px;" frameborder="0" allowfullscreen></iframe>`;

        document.getElementById('link-container').style.display = 'block';
        const linkInput = document.getElementById('generated-link');
        linkInput.value = iframeCode;
        document.getElementById('preview-link').href = finalUrl;
        
        window.location.hash = '#data=' + b64;

        const btn = document.getElementById('main-save-btn');
        const originalText = "✨ Сохранить и скопировать iframe для Genially";
        
        try {
            await navigator.clipboard.writeText(iframeCode);
            showSuccessButton(btn, originalText);
        } catch (err) {
            linkInput.select();
            document.execCommand("copy");
            showSuccessButton(btn, originalText);
        }
    }

    function showSuccessButton(btn, originalText) {
        btn.innerHTML = '✅ Код скопирован!';
        btn.style.background = '#2ed573';
        btn.style.boxShadow = '0 4px 0 #26b360';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = '#43e97b';
            btn.style.boxShadow = '0 4px 0 #38c566';
        }, 3000);
    }

    function forceEditMode(e) {
        if(e) e.preventDefault();
        const hash = window.location.hash;
        if (hash.startsWith('#data=')) {
            renderEditor(JSON.parse(decodeURIComponent(escape(atob(hash.substring(6))))));
        } else {
            renderEditor(defaultData);
        }
    }

    // --- ЛОГИКА ПЛЕЕРА ---
    function renderPlayer(data) {
        document.getElementById('editor-mode').style.display = 'none';
        document.getElementById('player-mode').style.display = 'block';
        document.body.classList.add('player-bg'); 

        const container = document.getElementById('exercise-container');
        container.innerHTML = '';
        
        // Устанавливаем размер сетки для тетради
        const ROWS = 3;
        const COLS = 22;

        data.forEach((item, taskIndex) => {
            const taskDiv = document.createElement('div');
            taskDiv.className = 'task-container';
            taskDiv.dataset.answers = item.answers;

            const condDiv = document.createElement('div');
            condDiv.className = 'task-condition';
            condDiv.innerHTML = `<span class="dot">•</span> <span>${item.condition}</span>`;
            taskDiv.appendChild(condDiv);

            const notebookWrapper = document.createElement('div');
            notebookWrapper.className = 'notebook-wrapper';

            const grid = document.createElement('div');
            grid.className = 'notebook-grid';

            for (let r = 0; r < ROWS; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grid-row';
                
                for (let c = 0; c < COLS; c++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.className = 'cell';
                    
                    // Управление стрелочками и автопереход
                    input.addEventListener('keydown', (e) => handleGridNavigation(e, r, c, grid, ROWS, COLS));
                    input.addEventListener('input', function(e) {
                        this.classList.remove('correct', 'incorrect');
                        if (this.value.length === 1 && c < COLS - 1) {
                            rowDiv.children[c + 1].focus();
                        }
                    });

                    rowDiv.appendChild(input);
                }
                grid.appendChild(rowDiv);
            }
            notebookWrapper.appendChild(grid);
            taskDiv.appendChild(notebookWrapper);
            container.appendChild(taskDiv);
        });
    }

    function handleGridNavigation(e, r, c, grid, maxR, maxC) {
        if (e.key === 'ArrowRight' && c < maxC - 1) {
            grid.children[r].children[c + 1].focus();
        } else if (e.key === 'ArrowLeft' && c > 0) {
            grid.children[r].children[c - 1].focus();
        } else if (e.key === 'ArrowDown' && r < maxR - 1) {
            grid.children[r + 1].children[c].focus();
        } else if (e.key === 'ArrowUp' && r > 0) {
            grid.children[r - 1].children[c].focus();
        } else if (e.key === 'Backspace' && e.target.value === '' && c > 0) {
            grid.children[r].children[c - 1].focus();
        }
    }

    // Нормализация строки (удаляем пробелы, приводим знаки к одному виду)
    function normalizeMathString(str) {
        return str.replace(/\s+/g, '')
                  .replace(/\*/g, '·')
                  .replace(/x/gi, '·')
                  .replace(/х/gi, '·') // Русская буква х
                  .replace(/:/g, ':')
                  .replace(/\//g, ':')
                  .replace(/-/g, '−') // Замена обычного дефиса на математический минус
                  .toLowerCase();
    }

    function checkAnswers() {
        const tasks = document.querySelectorAll('.task-container');
        
        tasks.forEach(task => {
            const rawAnswers = task.dataset.answers;
            if (!rawAnswers) return;

            // Парсим правильные ответы учителя
            const requiredLines = rawAnswers.split('\n')
                .map(line => line.trim())
                .filter(line => line !== '')
                .map(line => line.split('|').map(opt => normalizeMathString(opt.trim())));

            const rows = Array.from(task.querySelectorAll('.grid-row'));
            
            // Собираем то, что написал ученик в каждой строке
            const studentRowsData = rows.map(row => {
                const inputs = Array.from(row.querySelectorAll('.cell'));
                const text = inputs.map(inp => inp.value || ' ').join('');
                return {
                    rowElement: row,
                    inputs: inputs,
                    normalizedText: normalizeMathString(text),
                    matched: false
                };
            });

            // Очищаем предыдущие результаты
            task.querySelectorAll('.cell').forEach(c => c.classList.remove('correct', 'incorrect'));

            // Проверяем каждую обязательную строку от учителя
            requiredLines.forEach(validOptions => {
                const match = studentRowsData.find(sRow => !sRow.matched && validOptions.includes(sRow.normalizedText));
                if (match) {
                    match.matched = true;
                    match.inputs.forEach(inp => {
                        if (inp.value.trim() !== '') inp.classList.add('correct');
                    });
                }
            });

            // Строки с ошибками красим в красный
            studentRowsData.forEach(sRow => {
                if (!sRow.matched && sRow.normalizedText.length > 0) {
                    sRow.inputs.forEach(inp => {
                        if (inp.value.trim() !== '') inp.classList.add('incorrect');
                    });
                }
            });
        });
    }
</script>
</body>
</html>
