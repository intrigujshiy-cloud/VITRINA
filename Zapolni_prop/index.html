<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заполни пропуски - Игровое задание</title>
    <style>
        /* Базовые стили с мягким фоном */
        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
            background-color: #f4f7f6;
        }

        /* --- Стили для Редактора --- */
        #editor-mode {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 2px solid #e0e6ed;
        }
        .editor-row {
            background: #f8faff;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px dashed #c1d5ee;
            border-radius: 12px;
            position: relative;
        }
        .editor-row input[type="text"] {
            width: calc(100% - 24px);
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 16px;
        }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 8px 12px;
            font-weight: bold;
        }
        .add-btn {
            background: #4facfe;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .save-btn {
            background: #43e97b;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 4px 0 #38c566;
            transition: transform 0.1s;
        }
        .save-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        #link-container {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 12px;
            border: 2px solid #ffe69c;
        }
        #generated-link {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ffe69c;
            border-radius: 8px;
            font-family: monospace;
            resize: vertical;
        }

        /* --- Стили для Плеера (Игровой UI) --- */
        #player-mode {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 4px solid #f0f4f8;
        }
        
        .rainbow-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            background-image: linear-gradient(to right, #ff416c, #ff4b2b, #f7b733, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            color: transparent;
        }
        .rainbow-title .dot {
            color: #4facfe;
            font-size: 30px;
            margin-right: 12px;
            -webkit-text-fill-color: initial;
        }

        .task-container {
            margin-bottom: 30px;
            padding: 15px 15px 15px 20px;
            background: #fdfdfd;
            border-radius: 16px;
            border-left: 6px solid #ffca28;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        
        .task-condition {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            color: #444;
        }

        .equation-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            padding-left: 10px;
        }
        .equation-text {
            font-size: 26px;
            font-weight: bold;
            margin: 0 10px;
            color: #555;
        }

        /* Анимация радужной рамки */
        @keyframes rainbowBorder {
            0% { border-color: #ff416c; box-shadow: 0 0 8px rgba(255,65,108,0.4); }
            25% { border-color: #f7b733; box-shadow: 0 0 8px rgba(247,183,51,0.4); }
            50% { border-color: #4facfe; box-shadow: 0 0 8px rgba(79,172,254,0.4); }
            75% { border-color: #a18cd1; box-shadow: 0 0 8px rgba(161,140,209,0.4); }
            100% { border-color: #ff416c; box-shadow: 0 0 8px rgba(255,65,108,0.4); }
        }

        .box-group {
            display: inline-flex;
        }
        .digit-box {
            width: 36px;
            height: 44px;
            border: 3px solid #ccc;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            margin: 0 4px;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 10px;
            box-sizing: border-box;
            background: #fff;
            color: #333;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Включаем радугу по умолчанию */
            animation: rainbowBorder 3s linear infinite;
        }
        .digit-box:focus {
            transform: scale(1.15);
            z-index: 2;
        }

        /* Анимации ответов */
        @keyframes popSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .digit-box.correct {
            animation: popSuccess 0.4s ease-out forwards;
            background-color: #e3fcef;
            border-color: #2ed573;
            color: #2ed573;
            box-shadow: none;
        }
        .digit-box.incorrect {
            animation: shakeError 0.4s ease-out forwards;
            background-color: #ffeded;
            border-color: #ff4757;
            color: #ff4757;
            box-shadow: none;
        }

        /* 3D Кнопка в стиле мобильных игр */
        .check-btn {
            background: linear-gradient(180deg, #ffca28 0%, #ff8f00 100%);
            border: none;
            border-bottom: 6px solid #c56000;
            color: white;
            padding: 14px 35px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            display: block;
            margin: 30px auto 10px auto;
            transition: all 0.1s;
            outline: none;
        }
        .check-btn:active {
            transform: translateY(6px);
            border-bottom: 0px solid #c56000;
            margin-bottom: 16px;
        }

        .edit-trigger {
            display: block;
            margin-top: 30px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
        }
        .edit-trigger:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- РЕЖИМ РЕДАКТОРА -->
    <div id="editor-mode" style="display: none;">
        <h2>🛠 Конструктор игрового задания</h2>
        <p>1. Текст условия.<br>
           2. Уравнение. Числа, которые нужно спрятать в окошки, возьми в квадратные скобки <b>[ ]</b>.<br>
           <em>Пример: <b>[1503] - [587] = 916</b></em></p>
        
        <div id="questions-list"></div>

        <button class="add-btn" onclick="addEditorRow()">+ Добавить еще строку</button>
        <button class="save-btn" onclick="generateLink()">✨ Сохранить и получить ссылку</button>

        <div id="link-container" style="display: none;">
            <p><strong>Готово!</strong> Скопируй ссылку и вставь в Genially (вставка iframe):</p>
            <textarea id="generated-link" rows="5" readonly onclick="this.select()"></textarea>
            <br>
            <a id="preview-link" href="#" target="_blank" style="display: inline-block; margin-top: 10px; color: #4facfe; font-weight: bold; text-decoration: none;">▶ Открыть игру в новой вкладке</a>
        </div>
    </div>

    <!-- РЕЖИМ ПЛЕЕРА -->
    <div id="player-mode" style="display: none;">
        <div class="rainbow-title">
            <span class="dot">•</span> Заполни пропуски
        </div>
        
        <div id="exercise-container"></div>

        <button class="check-btn" onclick="checkAnswers()">Проверить</button>
        
        <a href="#" class="edit-trigger" onclick="forceEditMode(event)">[ Редактировать ]</a>
    </div>
</div>

<script>
    // Предзаполненные данные со скриншота (сразу вбиты по умолчанию)
    const defaultData = [
        { condition: 'Разность меньше уменьшаемого на 587.', equation: '[1503] - [587] = 916' },
        { condition: 'Произведение больше первого множителя в 17 раз.', equation: '[125] · [17] = 2125' },
        { condition: 'Сумма больше одного слагаемого на 4 718.', equation: '[1234] + [4718] = [5952]' },
        { condition: 'Частное меньше делимого в 26 раз.', equation: '[2314] : [26] = 89' }
    ];

    document.addEventListener("DOMContentLoaded", () => {
        init();
    });

    function init() {
        const hash = window.location.hash;
        if (hash.startsWith('#data=')) {
            try {
                const encodedData = hash.substring(6);
                const decodedStr = decodeURIComponent(encodedData);
                const jsonStr = atob(decodedStr);
                const data = JSON.parse(jsonStr);
                renderPlayer(data);
            } catch (e) {
                console.error("Ошибка при чтении данных", e);
                renderEditor(defaultData);
            }
        } else {
            // Если ссылка чистая (открыт сам файл), показываем редактор с вбитыми примерами
            renderEditor(defaultData);
        }
    }

    function renderEditor(existingData = null) {
        document.getElementById('editor-mode').style.display = 'block';
        document.getElementById('player-mode').style.display = 'none';
        
        const list = document.getElementById('questions-list');
        list.innerHTML = '';

        if (existingData && existingData.length > 0) {
            existingData.forEach(item => addEditorRow(item.condition, item.equation));
        } else {
            addEditorRow();
        }
    }

    function addEditorRow(condition = '', equation = '') {
        const list = document.getElementById('questions-list');
        const row = document.createElement('div');
        row.className = 'editor-row';
        row.innerHTML = `
            <button class="delete-btn" onclick="this.parentElement.remove()">✕</button>
            <input type="text" class="inp-condition" placeholder="Текст условия..." value="${condition}">
            <input type="text" class="inp-equation" placeholder="Уравнение (например: [125] · [17] = 2125)" value="${equation}">
        `;
        list.appendChild(row);
    }

    function generateLink() {
        const rows = document.querySelectorAll('.editor-row');
        const data = [];
        
        rows.forEach(row => {
            const condition = row.querySelector('.inp-condition').value.trim();
            const equation = row.querySelector('.inp-equation').value.trim();
            if (condition || equation) {
                data.push({ condition, equation });
            }
        });

        if (data.length === 0) {
            alert("Заполни хотя бы одно задание!");
            return;
        }

        const jsonStr = JSON.stringify(data);
        const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
        const finalUrl = window.location.href.split('#')[0] + '#data=' + b64;

        document.getElementById('link-container').style.display = 'block';
        document.getElementById('generated-link').value = finalUrl;
        document.getElementById('preview-link').href = finalUrl;
        
        window.location.hash = '#data=' + b64;
    }

    function forceEditMode(e) {
        if(e) e.preventDefault();
        const hash = window.location.hash;
        if (hash.startsWith('#data=')) {
            const encodedData = hash.substring(6);
            const decodedStr = decodeURIComponent(encodedData);
            const data = JSON.parse(atob(decodedStr));
            renderEditor(data);
        } else {
            renderEditor(defaultData);
        }
    }

    function renderPlayer(data) {
        document.getElementById('editor-mode').style.display = 'none';
        document.getElementById('player-mode').style.display = 'block';

        const container = document.getElementById('exercise-container');
        container.innerHTML = '';

        data.forEach(item => {
            const taskDiv = document.createElement('div');
            taskDiv.className = 'task-container';

            const condDiv = document.createElement('div');
            condDiv.className = 'task-condition';
            condDiv.innerHTML = `• ${item.condition}`;
            taskDiv.appendChild(condDiv);

            const eqDiv = document.createElement('div');
            eqDiv.className = 'equation-container';
            
            const parts = item.equation.split(/\[(.*?)\]/g);
            
            parts.forEach((part, index) => {
                if (index % 2 === 0) {
                    if (part.trim() !== '') {
                        const span = document.createElement('span');
                        span.className = 'equation-text';
                        span.textContent = part;
                        eqDiv.appendChild(span);
                    }
                } else {
                    const groupSpan = document.createElement('span');
                    groupSpan.className = 'box-group';
                    
                    for (let i = 0; i < part.length; i++) {
                        const char = part[i];
                        if(char === ' ') continue; 
                        
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = 1;
                        input.className = 'digit-box';
                        input.dataset.answer = char;
                        
                        // Плавный переход при вводе и удалении (backspace)
                        input.addEventListener('input', function(e) {
                            this.classList.remove('correct', 'incorrect');
                            if (this.value.length === 1) {
                                const allInputs = Array.from(document.querySelectorAll('.digit-box'));
                                const currentIndex = allInputs.indexOf(this);
                                if (currentIndex > -1 && currentIndex < allInputs.length - 1) {
                                    allInputs[currentIndex + 1].focus();
                                }
                            }
                        });

                        input.addEventListener('keydown', function(e) {
                            if (e.key === 'Backspace' && this.value === '') {
                                const allInputs = Array.from(document.querySelectorAll('.digit-box'));
                                const currentIndex = allInputs.indexOf(this);
                                if (currentIndex > 0) {
                                    allInputs[currentIndex - 1].focus();
                                }
                            }
                        });

                        groupSpan.appendChild(input);
                    }
                    eqDiv.appendChild(groupSpan);
                }
            });

            taskDiv.appendChild(eqDiv);
            container.appendChild(taskDiv);
        });
    }

    function checkAnswers() {
        const inputs = document.querySelectorAll('.digit-box');
        inputs.forEach(input => {
            const userAnswer = input.value.trim();
            const correctAnswer = input.dataset.answer;
            
            // Сброс анимации, чтобы она проигралась заново при повторном нажатии
            input.classList.remove('correct', 'incorrect');
            void input.offsetWidth; // Хак для перезапуска CSS-анимации
            
            if (userAnswer === correctAnswer) {
                input.classList.add('correct');
            } else {
                input.classList.add('incorrect');
            }
        });
    }
</script>
</body>
</html>
