<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngSmart 3.0</title>
    <style>
        :root { --primary: #4a90e2; --bg-overlay: transparent; --card-bg: #ffffff; --card-border: #4a90e2; --card-neon: rgba(74, 144, 226, 1); --btn-next: #4a90e2; --cyber-bg: #0d0d12; --cyber-panel: #1a1a24; --cyber-accent: #00f2ff; }
        
        /* ЗАЩИТА: Запрещаем выделение текста на уровне стилей во всем документе */
        body, html { 
            margin:0; padding:0; height:100vh; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #000;
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
            user-select: none; /* Standard */
        }
        
        #setup-screen { position: fixed; inset: 0; background: var(--cyber-bg); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .setup-panel { position: relative; background: var(--cyber-panel); padding: 20px; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); border: 1px solid var(--cyber-accent); width: 100%; max-width: 900px; display: flex; flex-direction: row; gap: 20px; height: 85vh; color: white; transition: 0.3s; }
        .setup-panel.drag-over { box-shadow: 0 0 50px rgba(255, 0, 85, 0.5) !important; border-color: #ff0055 !important; background: rgba(26, 26, 36, 0.95) !important; }
        .col-left { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 10px; }
        .col-right { flex: 1; display: flex; flex-direction: column; gap: 15px; border-left: 1px solid #333; padding-left: 20px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .color-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; }
        .color-field { display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 5px; text-transform: uppercase; letter-spacing: 1px; }
        /* Разрешаем выделение в полях редактора */
        textarea, input { user-select: auto; }
        textarea { height: 100px; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; resize: none; font-family: 'Courier New', monospace; width: 100%; box-sizing: border-box; color: var(--cyber-accent); outline: none; }
        #preview-zone { width: 100%; flex-grow: 1; min-height: 150px; border: 2px dashed var(--cyber-accent); border-radius: 10px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; position: relative; transition: background-image 0.3s; }
        #preview-label { position: absolute; top: 10px; left: 10px; background: black; color: var(--cyber-accent); padding: 5px 10px; font-size: 10px; border-radius: 4px; }
        .btn-start { background: #ff0055; color: white; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 18px; text-transform: uppercase; width: 100%; margin-top: auto; transition: 0.3s; }
        .copy-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-iframe { background: transparent; color: var(--cyber-accent); border: 1px solid var(--cyber-accent); padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; transition: 0.3s; text-align: center; }
        .btn-iframe:hover { background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        #iframeResult { background: #0a0a0f; color: #00f2ff; padding: 15px; font-family: 'Courier New', monospace; font-size: 11px; border: 1px solid #333; border-radius: 8px; display: none; margin-top: 10px; width: 100%; box-sizing: border-box; word-break: break-all; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
        
        .editor-logo { 
            position: absolute; 
            top: 0px; 
            right: 25px; 
            z-index: 20; display: block; cursor: pointer; 
            transition: transform 0.3s;
        }
        .editor-logo img {
            height: 110px; 
            width: auto;
            filter: drop-shadow(0 0 5px #ffd700); 
            /* Запрет перетаскивания картинки логотипа */
            -webkit-user-drag: none;
        }
        .editor-logo:hover { transform: scale(1.1); }

        #game-screen { display: none; height: 100vh; flex-direction: column; background-size: cover; background-position: center; position: relative; }
        .overlay { position: absolute; inset: 0; background: var(--bg-overlay); display: flex; flex-direction: column; }
        .header { height: 60px; display: flex; justify-content: center; align-items: center; gap: 15px; background: white; z-index: 10; box-shadow: 0 5px 20px rgba(0,0,0,0.1); flex-shrink: 0; position: relative; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; transition: 0.5s; cursor: pointer; }
        .dot.active { background: var(--primary); transform: scale(1.4); }
        .dot:hover { transform: scale(1.2); background: #bbb; }
        
        .content { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 15px; }
        
        .card { perspective: 1000px; cursor: pointer; transition: 0.3s; }
        .card.size-large { width: 160px; height: 220px; font-size: 16px; }
        .card.size-medium { width: 130px; height: 180px; font-size: 14px; }
        .card.size-small { width: 100px; height: 140px; font-size: 12px; margin: 3px; }
        
        .card-inner { position: relative; width: 100%; height: 100%; transition: 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--card-bg); border: 3px solid var(--card-border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px; text-align: center; box-shadow: 0 0 15px var(--card-neon), 0 0 30px var(--card-neon); color: #000 !important; }
        .card-face img { width: 100%; height: 60%; object-fit: contain; display: block; -webkit-user-drag: none; pointer-events: none; /* Картинка не реагирует на мышь */ }
        .card-face div { height: 35%; display: flex; align-items: center; justify-content: center; width: 100%; line-height: 1.1; overflow: hidden; }
        .card-back { transform: rotateY(180deg); font-weight: bold; color: #000 !important; display: flex; align-items: center; justify-content: center; }
        .preview-card { width: 120px; height: 160px; position: relative; transform-style: preserve-3d; }
        .footer { height: 70px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .next-btn { padding: 10px 30px; background: var(--btn-next); color: white; border: none; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        .match-item { padding: 10px; background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 10px; cursor: pointer; width: 45%; font-weight: bold; text-align: center; margin-bottom: 8px; box-shadow: 0 0 10px var(--card-neon), 0 0 20px var(--card-neon); color: #000 !important; font-size: 16px; }
        .match-item.selected { background: var(--card-border); color: white !important; }
        .match-item.hidden { opacity: 0; pointer-events: none; }
        @keyframes shake { 0%{transform: translateX(0);} 25%{transform: translateX(-5px);} 50%{transform: translateX(5px);} 75%{transform: translateX(-5px);} 100%{transform: translateX(0);} }
        .shake { animation: shake 0.4s; background: #ff4444 !important; color: white !important; }
        #az { min-height: 50px; border-bottom: 3px dashed var(--primary); margin: 15px auto; font-size: 30px; color: #000; letter-spacing: 5px; text-transform: uppercase; width: fit-content; padding: 0 20px; background: rgba(255,255,255,0.8); border-radius: 10px; }
        
        .brand-logo { position: absolute; bottom: 10px; right: 10px; z-index: 100; display: block; cursor: pointer; animation: pulse-logo 3s infinite; }
        .brand-logo:hover { transform: scale(1.1); }
        .brand-logo img { height: 115px; width: auto; filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 5px #ffd700) drop-shadow(0 0 15px #ffb300) drop-shadow(0 0 30px rgba(255, 179, 0, 0.4)); transition: all 0.3s ease; -webkit-user-drag: none; }
        .brand-logo:hover img { transform: scale(1.05); filter: drop-shadow(0 0 5px #ffffff) drop-shadow(0 0 10px #ffd700) drop-shadow(0 0 25px #ffb300) drop-shadow(0 0 40px rgba(255, 179, 0, 0.6)); }
        @keyframes pulse-logo { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        #victory { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        #victory h1 { font-size: 60px; color: #f1c40f; text-shadow: 0 0 20px #f1c40f; margin-bottom: 10px; }
        .hero-img { font-size: 100px; margin-bottom: 20px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
        .confetti { position: absolute; width: 10px; height: 10px; background: #f00; animation: fall 3s linear infinite; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    </style>
</head>
<body onload="init()">

                <img id="editorBrandImg" src="" alt="Brand">

            <div class="col-left">

                        <span style="font-size: 14px; color: white;">MODULE:</span>

            <div class="copy-group">

                <button class="btn-iframe" onclick="copyCode()">КОПИРОВАТЬ КОД (IFRAME) </> </button>
            </div>
            </div></div></div>
    
    <div id="game-screen">
        <div class="overlay">
            <div class="header">
                <div id="moduleDisplay" style="position: absolute; left: 20px; font-weight: bold; color: var(--primary); font-size: 24px; text-transform: uppercase; text-shadow: 0 0 10px var(--card-neon), 0 0 20px var(--card-neon);"></div>
                <div class="dot" id="d1" onclick="goToLevel(1)"></div>
                <div class="dot" id="d2" onclick="goToLevel(2)"></div>

            <div id="content" class="content"></div>
            <div class="footer"><button id="nextBtn" class="next-btn" onclick="nL()">NEXT →</button></div>
            <a id="brandLink" href="#" target="_blank" class="brand-logo"><img id="brandImg" src="" alt="Logo"></a>
        </div>
    </div>
    
    <div id="victory"><div class="hero-img">🦸‍♂️</div><h1>SUPERHERO!</h1><p style="font-size: 20px;">Mission accomplished!</p><button class="next-btn" style="margin-top: 30px;" onclick="location.reload()">REPLAY</button></div>
    
    <script>
        console.log("%cSTOP! Protected content.", "color: red; font-size: 30px;");
        let w = [], lvl = 1, mS = { en: null, ru: null }, cI = 0;
        
        const _0xSec = ["aHR0cHM6Ly9pbWcuZ2VuaWFsbHkuY29tLzY2ZjNhMzFiY2QxYTEyMDAxNTY4YWI4NS9lMmY5NzgyZi0xYmRlLTQ1ODctYWExNy0yMDBkMzg0ZDM3ZmMucG5n", "aHR0cHM6Ly92ay5jb20vYXJjZW5jaWVsbA==", "NDc1NTE3NTA="];

        function init() {
            const ps = new URLSearchParams(window.location.search);
            if(ps.has('play')) {
                loadGameFromUrl(ps);
            } else {
                document.getElementById('setup-screen').style.display = 'flex';
                document.getElementById('editorBrandImg').src = atob(_0xSec[0]);
                document.getElementById('editorBrandLink').href = atob(_0xSec[1]); 
                uS(); 
            }

            // Добавляем обработчики Drag & Drop для панели настроек
            const dp = document.querySelector('.setup-panel');
            if(dp) {
                dp.addEventListener('dragover', e => { 
                    e.preventDefault(); 
                    dp.classList.add('drag-over'); 
                });
                dp.addEventListener('dragleave', e => { 
                    e.preventDefault(); 
                    dp.classList.remove('drag-over'); 
                });
                dp.addEventListener('drop', e => {
                    e.preventDefault(); 
                    dp.classList.remove('drag-over');
                    if(e.dataTransfer.files && e.dataTransfer.files[0] && e.dataTransfer.files[0].type.startsWith('image/')) {
                        const r = new FileReader();
                        r.onload = evt => { 
                            document.getElementById('bgInput').value = evt.target.result; 
                            uS(); 
                        };
                        r.readAsDataURL(e.dataTransfer.files[0]);
                    }
                });
            }
        }

        function loadLocalBg(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('bgInput').value = evt.target.result;
                    uS();
                };
                reader.readAsDataURL(file);
            }
        }

        function uS() {
            const r = document.documentElement;
            r.style.setProperty('--card-border', document.getElementById('colorBorder').value); r.style.setProperty('--card-bg', document.getElementById('colorBg').value);
            r.style.setProperty('--card-neon', h2r(document.getElementById('colorNeon').value));

            const bu = document.getElementById('bgInput').value; if(bu) document.getElementById('preview-zone').style.backgroundImage = `url(${bu})`;
        }
        
        function h2r(h){ 
            let c; 
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(h)){ 
                c= h.substring(1).split(''); 
                if(c.length==3) c=[c[0],c[0],c[1],c[1],c[2],c[2]]; 
                c='0x'+c.join(''); 
                return 'rgba('+[(c>>16)&255,(c>>8)&255,c&255].join(',')+',1)'; 
            } 
            return 'rgba(74,144,226,1)'; 
        }
        
        function getUrl() {
            const e = encodeURIComponent(document.getElementById('enList').value.split('\n').join(',')), r = encodeURIComponent(document.getElementById('ruList').value.split('\n').join(',')), i = encodeURIComponent(document.getElementById('imgList').value.split('\n').join(',')), bg = encodeURIComponent(document.getElementById('bgInput').value), md = encodeURIComponent(document.getElementById('modInput').value);
            const p = `play=true&en=${e}&ru=${r}&im=${i}&bg=${bg}&md=${md}&cb=${encodeURIComponent(document.getElementById('colorBorder').value)}&cg=${encodeURIComponent(document.getElementById('colorBg').value)}&cn=${encodeURIComponent(document.getElementById('colorNeon').value)}&ct=${encodeURIComponent(document.getElementById('colorBtn').value)}`;
            return `${window.location.href.split('?')[0]}?${p}`;
        }

        function copyLink() {
            const u = getUrl();
            navigator.clipboard.writeText(u).then(() => { alert("Ссылка скопирована!"); });
        }

        function copyCode() {
            const u = getUrl();
            const c = `<iframe src="${u}" width="100%" height="600" style="border:none;" allow="autoplay"></iframe>`;
            navigator.clipboard.writeText(c).then(() => { alert("Код iFrame скопирован! (Insert -> Others)"); });
        }
        
        function sG() {
            uS(); const e = document.getElementById('enList').value.split('\n'), r = document.getElementById('ruList').value.split('\n'), i = document.getElementById('imgList').value.split('\n');
            w = e.map((x, k) => { let s = (i[k]||"").trim(); if(!s && x.trim()) s = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(x.trim()+' cartoon clipart')}&w=300&h=300&c=7&rs=1&p=0`; return { en: x.trim(), ru: (r[k]||"").trim(), im: s }; }).filter(x => x.en && x.ru);
            const bu = document.getElementById('bgInput').value; if(bu) document.getElementById('game-screen').style.backgroundImage = `url(${bu})`;
            
            const modVal = document.getElementById('modInput').value;
            if(modVal) { document.getElementById('moduleDisplay').innerText = modVal; }

            setBrand();
            document.getElementById('setup-screen').style.display = 'none'; document.getElementById('game-screen').style.display = 'flex'; rL();
        }

        function loadGameFromUrl(ps) {
            document.getElementById('colorBorder').value = ps.get('cb'); document.getElementById('colorBg').value = ps.get('cg'); document.getElementById('colorNeon').value = ps.get('cn'); document.getElementById('colorBtn').value = ps.get('ct'); uS(); const pe = ps.get('en').split(','), pr = ps.get('ru').split(','), pi = ps.get('im').split(','); w = pe.map((x, k) => { let s = pi[k]||""; if(!s && x) s = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(x+' cartoon clipart')}&w=300&h=300&c=7&rs=1&p=0`; return { en: x, ru: pr[k], im: s }; }); const bg = ps.get('bg'); if(bg) { document.getElementById('bgInput').value = bg; document.getElementById('game-screen').style.backgroundImage = `url(${bg})`; } 
            
            const md = ps.get('md');
            if(md) {
                document.getElementById('modInput').value = md;
                document.getElementById('moduleDisplay').innerText = md;
            }

            setBrand();
            document.getElementById('setup-screen').style.display = 'none'; document.getElementById('game-screen').style.display = 'flex'; rL();
        }

        function setBrand() {
            document.getElementById('brandImg').src = atob(_0xSec[0]); 
            document.getElementById('brandLink').href = atob(_0xSec[1]);
        }

        function goToLevel(n) {

            cI = 0; 
            document.getElementById('victory').style.display = 'none';
            rL();
        }

        function rL() {
            const c = document.getElementById('content'); c.innerHTML = ''; document.querySelectorAll('.dot').forEach((d, k) => d.className = (k+1 === lvl) ? 'dot active' : 'dot'); document.getElementById('nextBtn').style.display = 'block';
            if(lvl === 1) {
                let sc = 'size-medium'; if(w.length <= 6) sc = 'size-large'; else if(w.length >= 13) sc = 'size-small';
                w.forEach(x => { const d = document.createElement('div'); d.className = `card ${sc}`; d.innerHTML = `<div class="card-inner"><div class="card-face"><img src="${x.im}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3875/3875172.png'"><div>${x.en}</div></div><div class="card-face card-back">${x.ru}</div></div>`; d.onclick = () => { d.classList.toggle('flipped'); if(d.classList.contains('flipped')) spk(x.en); }; c.appendChild(d); });
            } else if(lvl === 2) {
                document.getElementById('nextBtn').style.display = 'none'; const el = [...w].sort(() => Math.random()-0.5), rl = [...w].sort(() => Math.random()-0.5); const ce = document.createElement('div'), cr = document.createElement('div'); ce.style.width=cr.style.width='45%';
                el.forEach(x => { const b = document.createElement('div'); b.className = 'match-item'; b.innerText = x.en; b.onclick = () => { spk(x.en); hM(x.en, 'en', b); }; ce.appendChild(b); });
                rl.forEach(x => { const b = document.createElement('div'); b.className = 'match-item'; b.innerText = x.ru; b.onclick = () => hM(x.en, 'ru', b); cr.appendChild(b); }); c.append(ce, cr);
            } else if(lvl === 3) {
                document.getElementById('nextBtn').style.display = 'none'; const x = w[cI]; let cs = ""; let lts = x.en.split('').sort(() => Math.random()-0.5);
                c.innerHTML = `<div style="text-align:center;width:100%"><img src="${x.im}" style="width:auto; height:auto; max-width:90%; max-height:30vh; object-fit:contain; display:block; margin:0 auto 10px" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3875/3875172.png'"><h3 style="color:#000;font-size:24px;margin:5px 0;">${x.ru}</h3><div id="az"></div><div id="lz"></div></div>`;
                const az = document.getElementById('az');
                lts.forEach(l => { const s = document.createElement('div'); s.className = 'match-item'; s.style.display='inline-block'; s.style.width='auto'; s.style.margin='5px'; s.style.padding='10px 20px'; s.innerText = l; s.onclick = () => { if (l.toLowerCase() === x.en[cs.length].toLowerCase()) { cs += l; az.innerText = cs; s.style.visibility = "hidden"; s.style.pointerEvents = "none"; if(cs.length === x.en.length) { spk(x.en); setTimeout(() => { cI++; if(cI < w.length) rL(); else { cI=0; document.getElementById('nextBtn').style.display='block'; } }, 600); } } else { s.classList.add('shake'); setTimeout(() => s.classList.remove('shake'), 400); } }; c.querySelector('#lz').appendChild(s); });
            } else if(lvl === 4) {
                document.getElementById('nextBtn').style.display = 'none'; const x = w[cI];
                c.innerHTML = `<div style="background:var(--card-bg);padding:20px;border-radius:20px;border:4px solid var(--card-border);text-align:center;width:90%;max-width:400px;margin:auto;box-shadow:0 0 20px var(--card-neon)"><img src="${x.im}" style="width:auto; height:auto; max-width:90%; max-height:150px; object-fit:contain;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3875/3875172.png'"><h3 style="color:#000;font-size:24px;">${x.ru}</h3><input type="text" id="wi" style="width:100%;font-size:30px;text-align:center;border:none;border-bottom:3px solid #ddd;outline:none;text-transform:uppercase;color:#000" autocomplete="off"></div>`;
                const inp = document.getElementById('wi'); inp.focus(); inp.oninput = () => { if(inp.value.toLowerCase() === x.en.toLowerCase()) { spk(x.en); setTimeout(() => { cI++; if(cI < w.length) rL(); else { document.getElementById('victory').style.display='flex'; cf(); } }, 500); } };
            }
        }
        
        function spk(t) { 
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(t)}`;
            const a = new Audio(url);
            const p = a.play();
            if (p !== undefined) { p.catch(error => { fbS(t); }); }
        }
        function fbS(t) {
            speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'en-US'; 
            const voices = speechSynthesis.getVoices();
            const gV = voices.find(v => v.name.includes("Google US") || v.name.includes("Samantha"));
            if(gV) m.voice = gV; speechSynthesis.speak(m);
        }
        window.speechSynthesis.onvoiceschanged = () => {};
        
        function hM(v, t, b) { if(mS[t]) mS[t].b.classList.remove('selected'); mS[t] = { v, b }; b.classList.add('selected'); if(mS.en && mS.ru) { if(mS.en.v === mS.ru.v) { mS.en.b.classList.add('hidden'); mS.ru.b.classList.add('hidden'); mS = { en: null, ru: null }; if(document.querySelectorAll('.match-item:not(.hidden)').length === 0) document.getElementById('nextBtn').style.display = 'block'; } else { setTimeout(() => { mS.en.b.classList.remove('selected'); mS.ru.b.classList.remove('selected'); mS = { en: null, ru: null }; }, 400); } } }
        function nL() { lvl++; cI = 0; if(lvl > 4) { document.getElementById('victory').style.display='flex'; cf(); } else rL(); }
        function cf() { for(let j=0; j<50; j++) { const c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random()*100+'vw'; c.style.background = `hsl(${Math.random()*360}, 100%, 50%)`; c.style.animationDelay = Math.random()*3+'s'; document.getElementById('victory').appendChild(c); } }

        /* 🔥 ЗАЩИТА ОТ КОПИРОВАНИЯ И ПЕРЕТАСКИВАНИЯ 🔥 */
        document.addEventListener('contextmenu', event => event.preventDefault()); // Блок правой кнопки
        document.onselectstart = function() { return false; }; // Блок выделения
        document.ondragstart = function() { return false; }; // Блок перетаскивания

        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+C
            if (e.ctrlKey && e.keyCode == 'A'.charCodeAt(0)) return false; // Ctrl+A
        };
    </script>
