<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои игры и тренажеры</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #1a1a1a;
            font-family: 'Comfortaa', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%);
        }
        h1 {
            color: #00f2ff;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            margin-bottom: 30px;
            text-align: center;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }
        .game-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: rgba(20, 20, 30, 0.9);
            color: #00f2ff;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #444;
            border-radius: 12px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .game-btn:hover {
            transform: scale(1.03);
            border-color: #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            background: rgba(30, 30, 45, 0.9);
        }
    </style>
</head>
<body>

    <h1>🎮 Мои учебные проекты</h1>
    
    <div class="menu-container">
        <a href="https://chefs-kiss-english.ru/defend-the-tower/" class="game-btn" target="_blank">🌻 Растения против Зомби</a>
        <a href="https://chefs-kiss-english.ru/Snakes/" class="game-btn" target="_blank">🐍 Змеи и Лестницы</a>
        <a href="https://chefs-kiss-english.ru/Wordtraining/" class="game-btn" target="_blank">📚 Тренировка новых слов</a>
        <a href="https://chefs-kiss-english.ru/irregular_Verbs475/" class="game-btn" target="_blank">⚡ Неправильные глаголы</a>
        <a href="https://chefs-kiss-english.ru/cross-null/" class="game-btn" target="_blank">❌ Крестики-нолики</a>
    </div>

</body>
</html>
