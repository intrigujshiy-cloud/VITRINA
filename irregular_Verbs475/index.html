<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs: Gamer Edition 🎮 (6 Stages)</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Black+Ops+One&family=Bungee&family=Creepster&family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Rajdhani:wght@500;700&family=Russo+One&family=VT323&family=Wallpoet&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(31, 40, 51, 0.9);
            --primary: #00ffff;
            --secondary: #45a29e;
            --accent: #c5c6c7;
            --danger: #ff00ff;
            --success: #00ff66;
            --font-main: 'Orbitron', sans-serif;
            --font-display: 'Orbitron', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: url('https://img.genially.com/66f3a31bcd1a12001568ab85/6fc47106-1b1e-4bbe-beab-cb5f5b1a059e.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-image 0.5s ease-in-out;
        }

        h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; text-align: center; transition: font-family 0.3s; }
        
        h1 {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary);
            margin-top: 0;
            background: rgba(0,0,0,0.6);
            padding: 10px 30px;
            border-radius: 10px;
            border: 2px solid var(--primary);
        }

        #teacher-panel {
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .setting-box {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--secondary);
        }

        textarea, input[type="text"], select {
            width: 100%;
            padding: 10px;
            background: #111;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 5px;
            font-family: var(--font-display);
            font-size: 1.1rem;
            outline: none;
            margin-top: 10px;
            transition: 0.3s;
        }
        
        input[type="text"]:focus { box-shadow: 0 0 10px var(--primary); }

        textarea { height: 80px; resize: none; font-family: var(--font-main); font-size: 0.9rem; }

        .color-picker-group { display: flex; gap: 15px; margin-top: 10px; }
        .color-picker-wrapper { display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; color: var(--accent); }
        
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px; height: 40px;
            cursor: pointer; background: none; padding: 0;
        }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 5px; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; justify-content: center;}
        
        .action-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
        }
        .action-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        .action-btn.start-btn { background: var(--success); color: #000; border-color: var(--success); font-size: 1.5rem; padding: 15px 40px; }

        .search-container { margin-bottom: 15px; }

        .verbs-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            background: #000;
            padding: 15px;
            border: 1px solid var(--secondary);
            border-radius: 5px;
        }

        .verb-checkbox { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; cursor: pointer; transition: 0.2s;}
        .verb-checkbox input { accent-color: var(--primary); width: 16px; height: 16px; }

        #game-panel { display: none; width: 100%; max-width: 1100px; }
        .stage-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
        .stage-btn {
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 10px 15px;
            font-family: var(--font-display);
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .stage-btn.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }

        .stage-container {
            background: var(--panel-bg);
            border: 2px solid var(--secondary);
            border-radius: 15px;
            padding: 30px;
            min-height: 400px;
            display: none;
            backdrop-filter: blur(5px);
        }
        .stage-container.active { display: flex; flex-direction: column; align-items: center; }

        .flip-card { background-color: transparent; width: 350px; height: 250px; perspective: 1000px; cursor: pointer; margin: 20px auto; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 3px solid var(--primary); background: #0b0c10; color: var(--primary);
            border-radius: 15px; box-shadow: inset 0 0 20px var(--primary), 0 0 15px rgba(0,0,0,0.8); padding: 20px;
        }
        .flip-card-back { transform: rotateY(180deg); border-color: var(--success); color: var(--success); box-shadow: inset 0 0 20px var(--success); }
        
        .fc-ru { font-size: 2rem; font-family: var(--font-display); color: #fff;}
        .fc-en { font-size: 2.2rem; font-family: var(--font-display); margin: 5px 0; text-shadow: 0 0 10px currentColor;}
        .fc-hint { font-size: 0.8rem; color: #888; margin-top: 15px; text-transform: uppercase; font-family: var(--font-main);}

        .trio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; width: 100%; margin-top: 20px; justify-content: center;}
        .trio-btn {
            background: #111; border: 2px solid var(--secondary); color: #fff; padding: 15px;
            font-family: var(--font-display); font-size: 1.3rem; cursor: pointer; border-radius: 8px; transition: 0.2s;
        }
        .trio-btn.selected, .trio-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 15px var(--primary);}
        .trio-btn.matched { background: var(--success); color: #000; opacity: 0; pointer-events: none; transition: 0.5s; }
        .trio-btn.error-shake { animation: shake 0.4s; background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; box-shadow: 0 0 15px var(--danger) !important; }

        .typing-duel { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0; width: 100%; flex-wrap: wrap; }
        
        .verb-box, .duel-input {
            flex: 1;
            min-width: 150px;
            height: 90px;
            padding: 10px;
            border-radius: 10px;
            font-size: 2.2rem !important;
            font-family: var(--font-display) !important;
            text-align: center;
            box-sizing: border-box;
            margin: 0;
        }

        .verb-box {
            background: #111; 
            border: 2px solid var(--primary); 
            color: var(--primary); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: inset 0 0 10px var(--primary); 
            text-shadow: 0 0 10px var(--primary);
        }
        
        .duel-input {
            background: rgba(0,0,0,0.8); 
            border: 3px dashed var(--danger); 
            color: #fff;
            outline: none; 
            transition: 0.3s;
        }
        
        .duel-input.success { border-color: var(--success); color: var(--success); border-style: solid; box-shadow: 0 0 20px var(--success); }
        .duel-input.error-shake { animation: shake 0.4s; border-color: var(--danger); background: rgba(255,0,255,0.1); }
        
        .status-msg { font-size: 1.3rem; height: 30px; margin-top: 10px; color: var(--danger); font-family: var(--font-display); text-shadow: 0 0 5px var(--danger);}

        /* ===== НОВЫЙ ДИЗАЙН ДЛЯ РУССКОГО СЛОВА (TARGET) ===== */
        .ru-hint { 
            font-size: 2.2rem; 
            color: #fff; 
            margin-bottom: 30px; 
            font-family: var(--font-display); 
            background: rgba(0,0,0,0.8); 
            padding: 15px 40px; 
            border-radius: 12px;
            border: 3px solid var(--primary);
            box-shadow: 0 0 20px var(--primary), inset 0 0 10px var(--primary);
            text-shadow: 0 0 10px var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .controls-wrapper { display: flex; justify-content: center; width: 100%; margin-top: 10px; }

        .next-item-btn {
            background: var(--success); color: #000; border: 2px solid var(--success); padding: 15px 30px;
            font-size: 1.3rem; font-family: var(--font-display); cursor: pointer; border-radius: 5px; display: none; 
            transition: 0.3s; box-shadow: 0 0 15px var(--success); text-transform: uppercase; font-weight: bold; width: 250px;
        }
        .next-item-btn:hover { background: transparent; color: var(--success); }

        .check-btn {
            background: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 15px 30px;
            font-size: 1.3rem; font-family: var(--font-display); cursor: pointer; border-radius: 5px; 
            transition: 0.3s; text-transform: uppercase; font-weight: bold; width: 250px;
        }
        .check-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    </style>
</head>
<body>

    <h1 id="main-title">Irregular Verbs 🎮</h1>

    <div id="teacher-panel">
        <h2>🛠️ Commander Settings</h2>
        
        <div class="settings-grid">
            <div class="setting-box">
                <label>🌐 Background URL:</label>
                <input type="text" id="bg-url" value="https://img.genially.com/66f3a31bcd1a12001568ab85/6fc47106-1b1e-4bbe-beab-cb5f5b1a059e.png">
                
                <label style="display:block; margin-top: 15px;">🔤 Game Font:</label>
                <select id="font-select" onchange="changeFont()">
                    <option value="Orbitron">Orbitron (Cyberpunk)</option>
                    <option value="Russo One">Russo One (Shooter)</option>
                    <option value="Black Ops One">Black Ops One (Military)</option>
                    <option value="Press Start 2P">Press Start 2P (Retro)</option>
                    <option value="Audiowide">Audiowide (Sci-Fi)</option>
                    <option value="Bungee">Bungee (Arcade)</option>
                    <option value="VT323">VT323 (Terminal)</option>
                    <option value="Creepster">Creepster (Horror)</option>
                </select>

                <label style="display:block; margin-top: 25px; color: var(--success); cursor: pointer; font-size: 1.1rem; border: 1px dashed var(--success); padding: 10px; border-radius: 5px; background: rgba(0,255,102,0.1);">
                    <input type="checkbox" id="two-forms-mode" style="width: 18px; height: 18px; accent-color: var(--success); margin-right: 10px; vertical-align: middle;">
                    Отрабатывать только 2 формы (Past Simple)
                </label>
            </div>
            
            <div class="setting-box">
                <label>🎨 Neon Colors:</label>
                <div class="color-picker-group">
                    <div class="color-picker-wrapper"><input type="color" id="color-primary" value="#00ffff" oninput="changeColors()"><span>Main</span></div>
                    <div class="color-picker-wrapper"><input type="color" id="color-danger" value="#ff00ff" oninput="changeColors()"><span>Error</span></div>
                    <div class="color-picker-wrapper"><input type="color" id="color-success" value="#00ff66" oninput="changeColors()"><span>Success</span></div>
                </div>
                
                <label style="display:block; margin-top: 15px;">➕ Add Custom Verbs (V1 V2 V3 Translation):</label>
                <textarea id="custom-verbs" placeholder="Example: swim swam swum плавать"></textarea>
                
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <button class="action-btn" style="flex: 1; font-size:0.8rem;" onclick="addCustomVerbs()">Save Custom</button>
                    <button class="action-btn" style="flex: 1; font-size:0.8rem; border-color: var(--danger); color: var(--danger);" onclick="clearCustomVerbs()">Clear Custom</button>
                </div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="verb-search" placeholder="🔍 Search verb (e.g. eat, go, run)..." oninput="searchVerbs()">
        </div>

        <div class="btn-group">
            <button class="action-btn" onclick="selectAll(true)">Check All</button>
            <button class="action-btn" onclick="selectAll(false)">Clear Checkboxes</button>
            <button class="action-btn" onclick="selectTop(20)">Top 20</button>
            <button class="action-btn" onclick="selectTop(50)">Top 50</button>
        </div>

        <div class="verbs-container" id="verbs-list"></div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="action-btn start-btn" onclick="startGame()">START GAME 🚀</button>
        </div>

        <div style="margin-top: 30px; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; border: 1px dashed var(--secondary); text-align: center;">
            <h3 style="margin-top: 0; font-size: 1.5rem; color: var(--secondary);">🌐 Genially iframe Export</h3>
            <button class="action-btn" id="iframe-btn" style="font-size: 1.1rem; margin-top: 10px; border-color: var(--success); color: var(--success); padding: 15px 30px;" onclick="generateAndCopyIframe()">📋 Создать и скопировать iframe</button>
        </div>
    </div>

    <div id="game-panel">
        <div class="stage-nav">
            <button class="stage-btn active" id="btn-1" onclick="showTab(1)">1. Database</button>
            <button class="stage-btn" id="btn-2" onclick="showTab(2)">2. Target Lock</button>
            <button class="stage-btn" id="btn-3" onclick="showTab(3)">3. Decrypt Link</button>
            <button class="stage-btn" id="btn-4" onclick="showTab(4)">4. Matrix Match</button>
            <button class="stage-btn" id="btn-5" onclick="showTab(5)">5. Code Inject</button>
            <button class="stage-btn" id="btn-6" onclick="showTab(6)">6. Full Override</button>
            <button class="stage-btn" style="background:var(--danger); color:#fff; border-color:var(--danger);" onclick="location.reload()">⚙️ Reboot</button>
        </div>

        <div id="stage-1" class="stage-container active">
            <h2>Stage 1: Memorize</h2>
            <div id="s1-content"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="action-btn" onclick="prevS1()"><<</button>
                <span id="s1-counter" style="font-size:1.5rem; padding: 10px;"></span>
                <button class="action-btn" onclick="nextS1()">>></button>
            </div>
        </div>

        <div id="stage-2" class="stage-container">
            <h2>Stage 2: Target Lock</h2>
            <div class="ru-hint" id="s2-ru"></div>
            <h3 id="s2-progress" style="color: var(--accent); font-family: var(--font-main);">Select V1 (Base)</h3>
            <div id="s2-options" class="trio-grid" style="margin-bottom: 30px;"></div>
            <button class="next-item-btn" id="s2-next" onclick="nextS2()">NEXT ➡️</button>
        </div>

        <div id="stage-3" class="stage-container">
            <h2>Stage 3: Decrypt the Link</h2>
            <div class="ru-hint" id="s3-ru"></div>
            <div class="typing-duel" id="s3-duel"></div>
            <div id="s3-options" class="trio-grid" style="margin-bottom: 20px;"></div>
            <div class="status-msg" id="s3-msg"></div>
            <button class="next-item-btn" id="s3-next" onclick="nextS3()">NEXT ➡️</button>
        </div>

        <div id="stage-4" class="stage-container">
            <h2>Stage 4: Matrix Match</h2>
            <div id="s4-grid" class="trio-grid"></div>
            <button class="next-item-btn" id="s4-next-btn" onclick="loadS4Chunk()" style="margin-top:20px;">Next Batch ➡️</button>
        </div>

        <div id="stage-5" class="stage-container">
            <h2>Stage 5: Code Inject</h2>
            <div class="ru-hint" id="s5-ru"></div>
            <div class="typing-duel" id="s5-duel"></div>
            <div class="status-msg" id="s5-msg"></div>
            <div class="controls-wrapper">
                <button class="check-btn" id="s5-check">CHECK</button>
                <button class="next-item-btn" id="s5-next" onclick="nextS5()">NEXT ➡️</button>
            </div>
        </div>

        <div id="stage-6" class="stage-container">
            <h2>Stage 6: Full Override</h2>
            <div class="ru-hint" id="s6-ru"></div>
            <div class="typing-duel" id="s6-duel"></div>
            <div class="status-msg" id="s6-msg"></div>
            <div class="controls-wrapper">
                <button class="check-btn" id="s6-check">CHECK ALL</button>
                <button class="next-item-btn" id="s6-next" onclick="nextS6()">NEXT ➡️</button>
            </div>
        </div>
    </div>

    <script>
        const initialDB = [
            {v1: "be", v2: "was/were", v3: "been", ru: "быть"}, {v1: "beat", v2: "beat", v3: "beaten", ru: "бить"},
            {v1: "become", v2: "became", v3: "become", ru: "становиться"}, {v1: "begin", v2: "began", v3: "begun", ru: "начинать"},
            {v1: "bite", v2: "bit", v3: "bitten", ru: "кусать"}, {v1: "blow", v2: "blew", v3: "blown", ru: "дуть"},
            {v1: "break", v2: "broke", v3: "broken", ru: "ломать"}, {v1: "bring", v2: "brought", v3: "brought", ru: "приносить"},
            {v1: "build", v2: "built", v3: "built", ru: "строить"}, {v1: "burn", v2: "burnt", v3: "burnt", ru: "гореть"},
            {v1: "buy", v2: "bought", v3: "bought", ru: "покупать"}, {v1: "catch", v2: "caught", v3: "caught", ru: "ловить"},
            {v1: "choose", v2: "chose", v3: "chosen", ru: "выбирать"}, {v1: "come", v2: "came", v3: "come", ru: "приходить"},
            {v1: "cost", v2: "cost", v3: "cost", ru: "стоить"}, {v1: "cut", v2: "cut", v3: "cut", ru: "резать"},
            {v1: "deal", v2: "dealt", v3: "dealt", ru: "иметь дело"}, {v1: "dig", v2: "dug", v3: "dug", ru: "копать"},
            {v1: "do", v2: "did", v3: "done", ru: "делать"}, {v1: "draw", v2: "drew", v3: "drawn", ru: "рисовать"},
            {v1: "dream", v2: "dreamt", v3: "dreamt", ru: "мечтать"}, {v1: "drink", v2: "drank", v3: "drunk", ru: "пить"},
            {v1: "drive", v2: "drove", v3: "driven", ru: "водить"}, {v1: "eat", v2: "ate", v3: "eaten", ru: "есть"},
            {v1: "fall", v2: "fell", v3: "fallen", ru: "падать"}, {v1: "feed", v2: "fed", v3: "fed", ru: "кормить"},
            {v1: "feel", v2: "felt", v3: "felt", ru: "чувствовать"}, {v1: "fight", v2: "fought", v3: "fought", ru: "бороться"},
            {v1: "find", v2: "found", v3: "found", ru: "находить"}, {v1: "fly", v2: "flew", v3: "flown", ru: "летать"},
            {v1: "forget", v2: "forgot", v3: "forgotten", ru: "забывать"}, {v1: "forgive", v2: "forgave", v3: "forgiven", ru: "прощать"},
            {v1: "freeze", v2: "froze", v3: "frozen", ru: "замерзать"}, {v1: "get", v2: "got", v3: "got", ru: "получать"},
            {v1: "give", v2: "gave", v3: "given", ru: "давать"}, {v1: "go", v2: "went", v3: "gone", ru: "идти"},
            {v1: "grow", v2: "grew", v3: "grown", ru: "расти"}, {v1: "hang", v2: "hung", v3: "hung", ru: "висеть"},
            {v1: "have", v2: "had", v3: "had", ru: "иметь"}, {v1: "hear", v2: "heard", v3: "heard", ru: "слышать"},
            {v1: "hide", v2: "hid", v3: "hidden", ru: "прятать"}, {v1: "hit", v2: "hit", v3: "hit", ru: "ударять"},
            {v1: "hold", v2: "held", v3: "held", ru: "держать"}, {v1: "hurt", v2: "hurt", v3: "hurt", ru: "ранить"},
            {v1: "keep", v2: "kept", v3: "kept", ru: "хранить"}, {v1: "know", v2: "knew", v3: "known", ru: "знать"},
            {v1: "lay", v2: "laid", v3: "laid", ru: "класть"}, {v1: "lead", v2: "led", v3: "led", ru: "вести"},
            {v1: "learn", v2: "learnt", v3: "learnt", ru: "учить"}, {v1: "leave", v2: "left", v3: "left", ru: "покидать"},
            {v1: "lend", v2: "lent", v3: "lent", ru: "одалживать"}, {v1: "let", v2: "let", v3: "let", ru: "позволять"},
            {v1: "lie", v2: "lay", v3: "lain", ru: "лежать"}, {v1: "light", v2: "lit", v3: "lit", ru: "зажигать"},
            {v1: "lose", v2: "lost", v3: "lost", ru: "терять"}, {v1: "make", v2: "made", v3: "made", ru: "делать (создавать)"},

        let customDB = JSON.parse(localStorage.getItem('gamer_verbs_custom') || '[]');

        function setBestVoice() {
            let voices = window.speechSynthesis.getVoices();
            preferredVoice = voices.find(v => v.name.includes('Male') && v.lang.includes('en-GB')) ||
                             voices.find(v => v.name.includes('Male') && v.lang.includes('en-US')) ||
                             voices.find(v => v.lang.includes('en'));
        }
        window.speechSynthesis.onvoiceschanged = setBestVoice;

        function speak(v1, v2, v3) {
            let text = v3 ? `${v1}, ${v2}, ${v3}` : `${v1}, ${v2}`;
            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.95; u.pitch = 1.0;
            if (preferredVoice) u.voice = preferredVoice;
            window.speechSynthesis.speak(u);
        }

        // --- ОБНОВЛЕННАЯ ФУНКЦИЯ ГЕНЕРАЦИИ IFRAME ---
        function generateAndCopyIframe() {
            // Берем ссылку страницы, на которой сейчас открыта игра
            let currentUrl = window.location.href;
            let iframeCode = `<iframe src="${currentUrl}" width="100%" height="800" frameborder="0" allowfullscreen></iframe>`;
            
            // Копируем в буфер обмена
            let tempInput = document.createElement("textarea");
            tempInput.value = iframeCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            // Меняем текст кнопки для обратной связи
            let btn = document.getElementById('iframe-btn');
            let originalText = btn.innerHTML;
            btn.innerHTML = "✅ СКОПИРОВАНО!";
            btn.style.background = "var(--success)";
            btn.style.color = "#000";
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = "transparent";
                btn.style.color = "var(--success)";
            }, 2000);
        }
        // ----------------------------------------

        function saveSelection() {
            let selected = [];
            document.querySelectorAll('.verb-checkbox input:checked').forEach(cb => {
                selected.push(fullDB[cb.dataset.idx].v1);
            });
            localStorage.setItem('gamer_verbs_selection', JSON.stringify(selected));
        }

        function renderCheckboxes() {
            const container = document.getElementById('verbs-list');
            container.innerHTML = "";
            fullDB.forEach((v, i) => {
                const label = document.createElement('label');
                label.className = 'verb-checkbox';
                const isCustom = i < customDB.length ? 'style="color:var(--primary);"' : '';
                const isChecked = savedSelection.includes(v.v1) ? 'checked' : '';
                label.innerHTML = `<input type="checkbox" data-idx="${i}" ${isChecked} onchange="saveSelection()"> <span ${isCustom}>${v.v1} - ${v.v2} - ${v.v3}</span>`;
                container.appendChild(label);
            });
        }

        function searchVerbs() {
            let val = document.getElementById('verb-search').value.toLowerCase();
            let labels = document.querySelectorAll('.verb-checkbox');
            labels.forEach(label => {
                let text = label.innerText.toLowerCase();
                if(text.includes(val)) {
                    label.style.display = 'flex';
                    if(val.length > 0) { label.style.textShadow = '0 0 10px var(--primary)'; label.style.color = 'var(--primary)'; } 
                    else { label.style.textShadow = 'none'; label.style.color = '#fff'; }
                } else {
                    label.style.display = 'none';
                }
            });
        }

        function addCustomVerbs() {
            const input = document.getElementById('custom-verbs').value.trim();
            if (!input) return;
            const lines = input.split('\n');
            let added = [];
            lines.forEach(line => {
                const parts = line.split(/\s+/);
                if (parts.length >= 4) {
                    added.unshift({ v1: parts[0], v2: parts[1], v3: parts[2], ru: parts.slice(3).join(" ") });
                }
            });
            if(added.length > 0) {
                customDB = [...added, ...customDB];
                localStorage.setItem('gamer_verbs_custom', JSON.stringify(customDB));
                fullDB = [...customDB, ...initialDB];
                added.forEach(v => savedSelection.push(v.v1));
                saveSelection();
            }
            document.getElementById('custom-verbs').value = "";
            renderCheckboxes();
        }

        function clearCustomVerbs() {
            if(confirm("Delete all manually added custom verbs?")) {
                localStorage.removeItem('gamer_verbs_custom');
                customDB = [];
                fullDB = [...initialDB];
                renderCheckboxes();
            }
        }

        function selectAll(s) { document.querySelectorAll('.verb-checkbox input').forEach(cb => cb.checked = s); saveSelection(); }
        function selectTop(n) { selectAll(false); document.querySelectorAll('.verb-checkbox input').forEach((cb, i) => { if(i<n) cb.checked=true; }); saveSelection(); }
        function changeFont() { document.documentElement.style.setProperty('--font-display', `"${document.getElementById('font-select').value}", sans-serif`); }
        function changeColors() {
            document.documentElement.style.setProperty('--primary', document.getElementById('color-primary').value);
            document.documentElement.style.setProperty('--danger', document.getElementById('color-danger').value);
            document.documentElement.style.setProperty('--success', document.getElementById('color-success').value);
        }
        function shuffle(arr) { let a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;}

        function startGame() {
            playList = [];
            document.querySelectorAll('.verb-checkbox input:checked').forEach(cb => playList.push(fullDB[cb.dataset.idx]));
            if(!playList.length) return alert("Select at least one verb!");
            
            isTwoForms = document.getElementById('two-forms-mode').checked; // СЧИТЫВАЕМ НАСТРОЙКУ 2 ФОРМ

            document.body.style.backgroundImage = `url('${document.getElementById('bg-url').value}')`;
            document.getElementById('teacher-panel').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
            initS1(); initS2(); initS3(); initS4(); initS5(); initS6();
            showTab(1);
        }

        function showTab(n) {
            document.querySelectorAll('.stage-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`stage-${n}`).classList.add('active');
            document.getElementById(`btn-${n}`).classList.add('active');
        }

        // ================= STAGE 1: Flashcards =================
        let s1Idx = 0;
        function initS1() { s1Idx = 0; renderS1(); }
        function renderS1() {
            if(s1Idx < 0) s1Idx = playList.length - 1;
            if(s1Idx >= playList.length) s1Idx = 0;
            const v = playList[s1Idx];
            document.getElementById('s1-counter').innerText = `${s1Idx+1}/${playList.length}`;
            
            let backHtml = `<div class="fc-en">${v.v1}</div><div class="fc-en">${v.v2}</div>`;
            if(!isTwoForms) backHtml += `<div class="fc-en">${v.v3}</div>`;
            let speakStr = isTwoForms ? `'${v.v1}', '${v.v2}'` : `'${v.v1}', '${v.v2}', '${v.v3}'`;

            document.getElementById('s1-content').innerHTML = `
                <div class="flip-card" onclick="this.classList.toggle('flipped'); speak(${speakStr})">
                    <div class="flip-card-inner">
                        <div class="flip-card-front"><div class="fc-ru">${v.ru}</div><div class="fc-hint">Click to flip & hear</div></div>
                        <div class="flip-card-back">${backHtml}</div>
                    </div>
                </div>`;
        }
        function prevS1() { s1Idx--; renderS1(); }
        function nextS1() { s1Idx++; renderS1(); }

        // ================= STAGE 2: Target Lock =================
        let s2L = [], s2I = 0, s2Form = 1, s2Timer = null;
        function initS2() { s2L = shuffle(playList); s2I = 0; renderS2(); }
        function renderS2() {
            clearTimeout(s2Timer);
            if(s2I >= s2L.length) { 
                document.getElementById('s2-options').innerHTML = "<h3>Level Clear!</h3>"; 
                document.getElementById('s2-next').style.display = 'none';
                return; 
            }
            let v = s2L[s2I]; 
            s2Form = 1;
            document.getElementById('s2-ru').innerText = `${v.ru} (${s2I+1}/${s2L.length})`;
            document.getElementById('s2-next').style.display = 'none';
            renderS2Options(v);
        }
        function renderS2Options(v) {
            let target = s2Form === 1 ? v.v1 : (s2Form === 2 ? v.v2 : v.v3);
            let formName = s2Form === 1 ? "V1 (Base)" : (s2Form === 2 ? "V2 (Past)" : "V3 (Participle)");
            document.getElementById('s2-progress').innerText = `Select ${formName}`;
            
            let wrongOptions = fullDB.filter(x => x.v1 !== v.v1).map(x => s2Form === 1 ? x.v1 : (s2Form === 2 ? x.v2 : x.v3));
            wrongOptions = [...new Set(wrongOptions)].filter(x => x !== target); 
            wrongOptions = shuffle(wrongOptions).slice(0, 2); 
            
            let opts = shuffle([target, ...wrongOptions]);
            
            let html = "";
            opts.forEach(o => {
                html += `<button class="trio-btn s2-opt-btn">${o}</button>`;
            });
            document.getElementById('s2-options').innerHTML = html;
            
            let maxForm = isTwoForms ? 2 : 3;

            document.querySelectorAll('.s2-opt-btn').forEach(btn => {
                btn.onclick = () => {
                    if(btn.disabled) return;
                    if(btn.innerText === target) {
                        btn.style.background = 'var(--success)';
                        btn.style.color = '#000';
                        btn.style.borderColor = 'var(--success)';
                        document.querySelectorAll('.s2-opt-btn').forEach(b => b.disabled = true);
                        
                        if(s2Form < maxForm) {
                            s2Form++;
                            s2Timer = setTimeout(() => renderS2Options(v), 500);
                        } else {
                            speak(v.v1, v.v2, isTwoForms ? undefined : v.v3);
                            let textStr = isTwoForms ? `${v.v1} - ${v.v2}` : `${v.v1} - ${v.v2} - ${v.v3}`;
                            document.getElementById('s2-options').innerHTML = `<div class="verb-box" style="border-color:var(--success); color:var(--success); box-shadow:0 0 20px var(--success);">${textStr}</div>`;
                            document.getElementById('s2-progress').innerText = "Target Locked!";
                            document.getElementById('s2-next').style.display = 'inline-block';
                            s2Timer = setTimeout(nextS2, 2000);
                        }
                    } else {
                        btn.classList.add('error-shake');
                        setTimeout(() => btn.classList.remove('error-shake'), 400);
                    }
                }
            });
        }
        function nextS2() { s2I++; renderS2(); }

        // ================= STAGE 3: Decrypt Link =================
        let s3L = [], s3I = 0, s3A = 0, s3Timer = null;
        function initS3() { s3L = shuffle(playList); s3I = 0; renderS3(); }
        function renderS3() {
            clearTimeout(s3Timer);
            if(s3I >= s3L.length) { 
                document.getElementById('s3-duel').innerHTML = "<h3>Level Clear!</h3>"; 
                document.getElementById('s3-options').innerHTML = "";
                document.getElementById('s3-next').style.display = 'none';
                return; 
            }
            let v = s3L[s3I]; 
            s3A = 0;
            document.getElementById('s3-msg').innerText = ""; 
            document.getElementById('s3-next').style.display = 'none';
            document.getElementById('s3-ru').innerText = `${v.ru} (${s3I+1}/${s3L.length})`;
            
            let maxForm = isTwoForms ? 2 : 3;
            let h = Math.floor(Math.random() * maxForm) + 1; 
            let ans = v['v'+h];
            
            let html = "";
            for(let i=1; i<=maxForm; i++) {
                if(i===h) html += `<div class="duel-input" id="s3-blank" style="border-style:dashed; cursor:default; display:flex; align-items:center; justify-content:center; color:#888;">[ ? ]</div>`;
                else html += `<div class="verb-box">${v['v'+i]}</div>`;
            }
            document.getElementById('s3-duel').innerHTML = html;
            
            let wrongOptions = fullDB.filter(x => x.v1 !== v.v1).map(x => x['v'+h]);
            wrongOptions = [...new Set(wrongOptions)].filter(x => x !== ans); 
            wrongOptions = shuffle(wrongOptions).slice(0, 3); 
            let opts = shuffle([ans, ...wrongOptions]);
            
            let optHtml = "";
            opts.forEach(o => { optHtml += `<button class="trio-btn s3-opt-btn">${o}</button>`; });
            document.getElementById('s3-options').innerHTML = optHtml;
            
            document.querySelectorAll('.s3-opt-btn').forEach(btn => {
                btn.onclick = () => {
                    if(btn.disabled) return;
                    if(btn.innerText === ans) {
                        btn.style.background = 'var(--success)'; btn.style.color = '#000';
                        document.getElementById('s3-blank').innerText = ans;
                        document.getElementById('s3-blank').classList.add('success');
                        document.querySelectorAll('.s3-opt-btn').forEach(b => b.disabled = true);
                        speak(v.v1, v.v2, isTwoForms ? undefined : v.v3);
                        document.getElementById('s3-next').style.display = 'inline-block';
                        s3Timer = setTimeout(nextS3, 1500);
                    } else {
                        s3A++;
                        btn.classList.add('error-shake');
                        setTimeout(() => btn.classList.remove('error-shake'), 400);
                        document.getElementById('s3-msg').innerText = `Error ${s3A}/3`;
                        if(s3A >= 3) {
                            document.getElementById('s3-blank').innerText = ans;
                            document.getElementById('s3-blank').classList.add('success');
                            document.querySelectorAll('.s3-opt-btn').forEach(b => b.disabled = true);
                            speak(v.v1, v.v2, isTwoForms ? undefined : v.v3);
                            document.getElementById('s3-next').style.display = 'inline-block';
                            s3Timer = setTimeout(nextS3, 3000);
                        }
                    }
                }
            });
        }
        function nextS3() { s3I++; renderS3(); }

        // ================= STAGE 4: Matrix Match =================
        let s4Chunks = [], s4Cur = 0, selS4 = [];
        function initS4() {
            let sh = shuffle(playList); s4Chunks = [];
            for(let i=0; i<sh.length; i+=4) s4Chunks.push(sh.slice(i, i+4));
            s4Cur = 0; loadS4Chunk();
        }
        function loadS4Chunk() {
            const grid = document.getElementById('s4-grid');
            if(s4Cur >= s4Chunks.length) { grid.innerHTML = "<h3>All Clear!</h3>"; return; }
            document.getElementById('s4-next-btn').style.display = 'none';
            let btns = [];
            s4Chunks[s4Cur].forEach(v => { 
                btns.push({t:v.v1, p:v},{t:v.v2, p:v}); 
                if(!isTwoForms) btns.push({t:v.v3, p:v});
            });
            btns = shuffle(btns);
            grid.innerHTML = "";
            let targetLength = isTwoForms ? 2 : 3;
            btns.forEach(b => {
                let el = document.createElement('button'); el.className = "trio-btn"; el.innerText = b.t;
                el.onclick = () => {
                    if(el.classList.contains('selected') || el.classList.contains('matched')) return;
                    el.classList.add('selected'); selS4.push({el, b});
                    if(selS4.length === targetLength) {
                        let p = selS4[0].b.p;
                        let seq = selS4[0].el.innerText === p.v1 && selS4[1].el.innerText === p.v2;
                        if(!isTwoForms) seq = seq && selS4[2].el.innerText === p.v3;
                        
                        if(selS4.every(i => i.b.p === p) && seq) {
                            speak(p.v1, p.v2, isTwoForms ? undefined : p.v3);
                            selS4.forEach(i => i.el.classList.add('matched'));
                            if(!document.querySelectorAll('#s4-grid .trio-btn:not(.matched)').length) { s4Cur++; document.getElementById('s4-next-btn').style.display='block'; }
                        } else {
                            selS4.forEach(i => { i.el.classList.add('error-shake'); setTimeout(() => i.el.classList.remove('selected', 'error-shake'), 400); });
                        }
                        selS4 = [];
                    }
                };
                grid.appendChild(el);
            });
        }

        // ================= STAGE 5: Code Inject =================
        let s5L = [], s5I = 0, s5A = 0, s5Timer = null;
        function initS5() { s5L = shuffle(playList); s5I = 0; renderS5(); }
        function renderS5() {
            clearTimeout(s5Timer);
            if(s5I >= s5L.length) { 
                document.getElementById('s5-duel').innerHTML = "<h3>Level Clear!</h3>"; 
                document.getElementById('s5-check').style.display = 'none';
                document.getElementById('s5-next').style.display = 'none';
                return; 
            }
            
            let v = s5L[s5I]; s5A = 0;
            document.getElementById('s5-msg').innerText = ""; 
            document.getElementById('s5-next').style.display = 'none';
            document.getElementById('s5-check').style.display = 'inline-block';
            document.getElementById('s5-ru').innerText = `${v.ru} (${s5I+1}/${s5L.length})`;
            
            let maxForm = isTwoForms ? 2 : 3;
            let h = Math.floor(Math.random() * maxForm) + 1;
            let html = ""; let ans = v['v'+h];
            
            for(let i=1; i<=maxForm; i++) {
                if(i===h) {
                    html += `<input type="text" class="duel-input" id="s5-in" placeholder="V${i}" autocomplete="off">`;
                } else {
                    html += `<div class="verb-box">${v['v'+i]}</div>`;
                }
            }
            document.getElementById('s5-duel').innerHTML = html;
            
            const input = document.getElementById('s5-in'); 
            const checkBtn = document.getElementById('s5-check');
            input.focus();
            
            input.onkeyup = (e) => { if(e.key==='Enter') checkS5(input, ans, v); };
            checkBtn.onclick = () => checkS5(input, ans, v);
        }

        function checkS5(input, answer, v) {
            if(input.disabled) return;
            let val = input.value.trim().toLowerCase();
            if(val === answer.toLowerCase()) {
                input.classList.add('success'); input.disabled = true; speak(v.v1, v.v2, isTwoForms ? undefined : v.v3);
                document.getElementById('s5-check').style.display = 'none';
                document.getElementById('s5-next').style.display = 'inline-block';
                s5Timer = setTimeout(nextS5, 1500); 
            } else {
                s5A++; input.classList.add('error-shake'); setTimeout(() => input.classList.remove('error-shake'), 400);
                document.getElementById('s5-msg').innerText = `Error ${s5A}/3`;
                if(s5A >= 3) { 
                    input.value = answer; input.classList.add('success'); input.disabled = true; speak(v.v1, v.v2, isTwoForms ? undefined : v.v3); 
                    document.getElementById('s5-check').style.display = 'none';
                    document.getElementById('s5-next').style.display = 'inline-block';
                    s5Timer = setTimeout(nextS5, 3000); 
                }
            }
        }
        function nextS5() { clearTimeout(s5Timer); s5I++; renderS5(); }

        // ================= STAGE 6: Full Override =================
        let s6L = [], s6I = 0, s6A = 0, s6Timer = null;
        function initS6() { s6L = shuffle(playList); s6I = 0; renderS6(); }
        function renderS6() {
            clearTimeout(s6Timer);
            if(s6I >= s6L.length) { 
                document.getElementById('s6-duel').innerHTML = "<h3>Level Clear! You are a legend! 🏆</h3>"; 
                document.getElementById('s6-check').style.display = 'none';
                document.getElementById('s6-next').style.display = 'none';
                return; 
            }
            
            let v = s6L[s6I]; s6A = 0;
            document.getElementById('s6-msg').innerText = ""; 
            document.getElementById('s6-next').style.display = 'none';
            document.getElementById('s6-check').style.display = 'inline-block';
            document.getElementById('s6-ru').innerText = `${v.ru} (${s6I+1}/${s6L.length})`;
            
            let html = `
                <input type="text" class="duel-input" id="s6-in1" placeholder="V1" autocomplete="off">
                <input type="text" class="duel-input" id="s6-in2" placeholder="V2" autocomplete="off">
                ${isTwoForms ? '' : '<input type="text" class="duel-input" id="s6-in3" placeholder="V3" autocomplete="off">'}
            `;
            document.getElementById('s6-duel').innerHTML = html;
            
            const in1 = document.getElementById('s6-in1'); 
            const in2 = document.getElementById('s6-in2'); 
            const in3 = document.getElementById('s6-in3'); 
            const checkBtn = document.getElementById('s6-check');
            
            in1.focus();
            
            const handleEnter = (e) => { if(e.key==='Enter') checkS6(in1, in2, in3, v); };
            in1.onkeyup = handleEnter;
            in2.onkeyup = handleEnter;
            if(in3) in3.onkeyup = handleEnter;
            checkBtn.onclick = () => checkS6(in1, in2, in3, v);
        }

        function checkS6(in1, in2, in3, v) {
            if(in1.disabled) return;
            
            let v1Correct = in1.value.trim().toLowerCase() === v.v1.toLowerCase();
            let v2Correct = in2.value.trim().toLowerCase() === v.v2.toLowerCase();
            let v3Correct = isTwoForms ? true : in3.value.trim().toLowerCase() === v.v3.toLowerCase();
            
            let items = [ {el: in1, ok: v1Correct}, {el: in2, ok: v2Correct} ];
            if(!isTwoForms) items.push({el: in3, ok: v3Correct});

            items.forEach(item => {
                if(item.ok) {
                    item.el.classList.add('success');
                    item.el.classList.remove('error-shake');
                } else {
                    item.el.classList.add('error-shake');
                    item.el.classList.remove('success');
                    setTimeout(() => item.el.classList.remove('error-shake'), 400);
                }
            });

            if(v1Correct && v2Correct && v3Correct) {
                in1.disabled = true; in2.disabled = true; 
                if(!isTwoForms) in3.disabled = true;
                speak(v.v1, v.v2, isTwoForms ? undefined : v.v3);
                document.getElementById('s6-check').style.display = 'none';
                document.getElementById('s6-next').style.display = 'inline-block';
                s6Timer = setTimeout(nextS6, 1500); 
            } else {
                s6A++; 
                document.getElementById('s6-msg').innerText = `Error ${s6A}/3`;
                if(s6A >= 3) { 
                    in1.value = v.v1; in1.classList.add('success'); in1.disabled = true;
                    in2.value = v.v2; in2.classList.add('success'); in2.disabled = true;
                    if(!isTwoForms) { in3.value = v.v3; in3.classList.add('success'); in3.disabled = true; }
                    speak(v.v1, v.v2, isTwoForms ? undefined : v.v3); 
                    document.getElementById('s6-check').style.display = 'none';
                    document.getElementById('s6-next').style.display = 'inline-block';
                    s6Timer = setTimeout(nextS6, 3000); 
                }
            }
        }
        function nextS6() { clearTimeout(s6Timer); s6I++; renderS6(); }

        window.onload = () => { renderCheckboxes(); changeFont(); };
    </script>
</body>
</html>
