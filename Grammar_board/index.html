        function makeDraggableElement(el) {
            let isDraggingLoc = false, sX, sY, iX, iY;
            el.addEventListener('mousedown', e => {
                window.activeDraggable = el; // Запоминаем элемент, по которому кликнули
                window.lastActiveMarker = el; // Синхронизируем и с цветом рамки
                
                // Подсвечиваем корзину, чтобы показать, что в неё можно кидать
                const trash = document.getElementById('trashBin');
                if (trash) { trash.style.opacity = '1'; trash.style.transform = 'scale(1.1)'; trash.style.background = '#FEE2E2'; }

                // Блокируем перетаскивание при активной шторке, чтобы она рисовалась без сдвига карточки
                if(currentMode === 'blind') return;
                
                if(e.target.closest('.close-btn') || e.target.closest('.pull-btn') || e.target.tagName === 'SUMMARY' || e.target.closest('summary') || document.activeElement === e.target) return;
                isDraggingLoc = true; sX = e.clientX; sY = e.clientY; iX = el.offsetLeft; iY = el.offsetTop; el.style.zIndex = 1000;
            });
            document.addEventListener('mousemove', e => { 
                if(!isDraggingLoc) return; 
                el.style.left = (iX + e.clientX - sX) + 'px'; 
                el.style.top = (iY + e.clientY - sY) + 'px'; 
            });
            document.addEventListener('mouseup', (e) => { 
                // Возвращаем корзину в "спящий" режим
                const trash = document.getElementById('trashBin');
                if (trash) { trash.style.opacity = '0.5'; trash.style.transform = 'scale(1)'; trash.style.background = 'rgba(255, 255, 255, 0.8)'; }

                if(isDraggingLoc) { 
                    isDraggingLoc = false; el.style.zIndex = ''; 
                    
                    // Логика броска в корзину
                    if (trash) {
                        const rect = trash.getBoundingClientRect();
                        // Проверяем, находится ли мышка над корзиной при отпускании левой кнопки
                        if (e.clientX > rect.left && e.clientX < rect.right && e.clientY > rect.top && e.clientY < rect.bottom) {
                            el.remove();
                            window.activeDraggable = null;
                        }
                    }
                    recordHistory(); 
                } 
            });
        }

        // --- UNDO / REDO СИСТЕМА ---
        function serializeCurrentSlide() {
            const draggables = Array.from(draggablesContainer.children).map(el => {
                if (el.classList.contains('blind-box')) {
                    return { type: 'blind', left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
                }
                const openDetails = Array.from(el.querySelectorAll('details')).map((d, i) => d.open ? i : -1).filter(i => i !== -1);
                return { type: el.dataset.cardType || 'text', topicKey: el.dataset.topicKey || '', left: el.style.left, top: el.style.top, title: el.querySelector('h4') ? el.querySelector('h4').innerText : '', content: el.querySelector('.content').innerHTML, openDetails: openDetails };
            });
            return { 
                drawing: canvas.toDataURL(), 
                draggables: draggables, 
                bg: document.getElementById('bgSelector').value,
                customBg: canvasContainer.dataset.customBg || null // Сохраняем загруженную картинку
            };
        }

        function restoreSlideData(data) {
            isRestoringHistory = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (data.drawing) { const img = new Image(); img.onload = () => { ctx.drawImage(img, 0, 0); updateContextSettings(); }; img.src = data.drawing; }
            
            document.getElementById('bgSelector').value = data.bg || 'bg-lines';
            if (data.bg === 'custom' && data.customBg) {
                canvasContainer.className = 'canvas-container';
                canvasContainer.style.backgroundImage = `url('${data.customBg}')`;
                canvasContainer.style.backgroundSize = 'contain';
                canvasContainer.style.backgroundRepeat = 'no-repeat';
                canvasContainer.style.backgroundPosition = 'center';
                canvasContainer.dataset.customBg = data.customBg;
            } else {
                canvasContainer.className = 'canvas-container ' + (data.bg || 'bg-lines');
                canvasContainer.style.backgroundImage = '';
                delete canvasContainer.dataset.customBg;
            }
            
            draggablesContainer.innerHTML = '';
            data.draggables.forEach(d => {
                if (d.type === 'blind') { createBlind(parseInt(d.left), parseInt(d.top), parseInt(d.width), parseInt(d.height)); }
                else {
                    const el = createDraggable(d.type, (d.type !== 'text' && d.topicKey) ? d.topicKey : d.content, parseInt(d.left), parseInt(d.top), d.title, d.type !== 'text' ? d.content : null);
                    if(d.type === 'text') el.querySelector('.content').innerText = d.content;
                    if(d.openDetails) { const details = el.querySelectorAll('details'); d.openDetails.forEach(index => { if(details[index]) details[index].open = true; }); }
                }
            });
            isRestoringHistory = false;
        }

        function recordHistory() {
            if(isRestoringHistory) return;
            historyStep++;
            historyStack.length = historyStep;
            const state = serializeCurrentSlide();
            historyStack.push(state);
            saveToLocalStorage();
            
            // Если есть активное P2P подключение - отправляем слайд ученику
            if (window.boardConn && window.boardConn.open) {
                window.boardConn.send({ type: 'sync', data: state });
            }
        }

        // --- ЛОГИКА P2P СОЕДИНЕНИЯ (ФАЗА 1) ---
        window.boardPeer = null;
        window.boardConn = null;

        const peerConfig = {
            debug: 2, // Включаем отладку, чтобы видеть возможные скрытые ошибки в консоли
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        document.getElementById('btnCreateRoom').onclick = () => {
            const statusEl = document.getElementById('collabStatus');
            statusEl.innerText = 'Создание комнаты...';
            
            // Уничтожаем старые подключения, чтобы не было "призраков"
            if (window.boardPeer) window.boardPeer.destroy();
            
            const shortId = 'CHEF-' + Math.random().toString(36).substr(2, 5).toUpperCase();
            window.boardPeer = new Peer(shortId, peerConfig);
            
            window.boardPeer.on('open', (id) => {
                statusEl.innerHTML = `<span style="color:#4F46E5;">Ваш код:</span> <b>${id}</b><br>Продиктуйте ученику!`;
            });
            
            window.boardPeer.on('connection', (conn) => {
                window.boardConn = conn;
                setupConnection();
                
                conn.on('open', () => {
                    statusEl.innerHTML = `<b style="color: #10B981;">🟢 Ученик подключен!</b>`;
                    // ВАЖНО: Мы больше не стреляем данными вслепую!
                    // Ждем сигнала ready от ученика
                });
            });
            
            window.boardPeer.on('error', (err) => {
                console.error(err);
                statusEl.innerHTML = `<b style="color: #EF4444;">Ошибка сервера связи</b>`;
            });
        };

        document.getElementById('btnJoinRoom').onclick = () => {
            const roomId = document.getElementById('joinRoomId').value.trim().toUpperCase();
            if(!roomId) return;
            
            const statusEl = document.getElementById('collabStatus');
            statusEl.innerText = 'Подключение...';
            
            // Уничтожаем старые подключения
            if (window.boardPeer) window.boardPeer.destroy();
            
            window.boardPeer = new Peer(peerConfig);
            
            window.boardPeer.on('open', () => {
                // Возвращаем надежный канал, так как мы решили проблему хэндшейком!
                window.boardConn = window.boardPeer.connect(roomId, { reliable: true });
                
                window.boardConn.on('open', () => {
                    statusEl.innerHTML = `<b style="color: #10B981;">🟢 Связь установлена!</b>`;
                    setupConnection();
                    
                    // Говорим учителю, что мы полностью готовы принять доску
                    window.boardConn.send({ type: 'ready' });
                });
                
                window.boardConn.on('error', (err) => {
                    console.error(err);
                    statusEl.innerHTML = `<b style="color: #EF4444;">Сбой канала</b>`;
                });
            });
            
            window.boardPeer.on('error', (err) => {
                console.error(err);
                statusEl.innerHTML = `<b style="color: #EF4444;">Ошибка кода или связи</b>`;
            });
        };

        function setupConnection() {
            // Показываем чат при успешном соединении
            document.getElementById('chatArea').style.display = 'flex';
            
            window.boardConn.on('data', (msg) => {
                if (msg.type === 'ready') {
                    // Учитель поймал сигнал готовности от ученика и теперь безопасно отправляет доску!
                    window.boardConn.send({ type: 'sync', data: serializeCurrentSlide() });
                } else if (msg.type === 'sync') {
                    // Блокируем запись истории во время получения чужих данных
                    isRestoringHistory = true;
                    restoreSlideData(msg.data);
                    slides[currentSlideIndex] = msg.data;
                    isRestoringHistory = false;
                } else if (msg.type === 'chat') {
                    addChatMessage('Ученик', msg.text, '#EF4444');
                } else if (msg.type === 'file') {
                    const fileLink = `<a href="${msg.data}" download="${msg.filename}" style="color: #4F46E5; text-decoration: underline; font-weight: bold;">📁 Скачать: ${msg.filename}</a>`;
                    addChatMessage('Ученик', fileLink, '#EF4444');
                }
            });
            window.boardConn.on('close', () => {
                document.getElementById('collabStatus').innerHTML = `<b style="color: #EF4444;">Ученик отключился</b>`;
                document.getElementById('chatArea').style.display = 'none';
            });
        }

        // --- ЛОГИКА ЧАТА ---
        function addChatMessage(sender, text, color) {
            const box = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            // Если текст похож на ссылку, делаем его кликабельным
            const formattedText = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: #4F46E5; text-decoration: underline;">$1</a>');
            msgDiv.innerHTML = `<b style="color: ${color};">${sender}:</b> <span style="word-break: break-word;">${formattedText}</span>`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight; // Автоскролл вниз
        }

        document.getElementById('btnSendMsg').onclick = () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text && window.boardConn && window.boardConn.open) {
                window.boardConn.send({ type: 'chat', text: text });
                addChatMessage('Вы', text, '#10B981'); // Зеленый цвет для учителя
                input.value = '';
            }
        };
        
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('btnSendMsg').click();
        });

        document.getElementById('btnUndo').onclick = () => { if (historyStep > 0) { historyStep--; restoreSlideData(historyStack[historyStep]); saveToLocalStorage(); } };
        document.getElementById('btnRedo').onclick = () => { if (historyStep < historyStack.length - 1) { historyStep++; restoreSlideData(historyStack[historyStep]); saveToLocalStorage(); } };
document.getElementById('btnSendFile').onclick = () => document.getElementById('chatFileInput').click();
        
        document.getElementById('chatFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('Файл слишком большой! Максимум 5 МБ для прямой отправки.'); return; }
            
            const reader = new FileReader();
            reader.onload = (event) => {
                if (window.boardConn && window.boardConn.open) {
                    window.boardConn.send({ type: 'file', filename: file.name, data: event.target.result });
                    const fileLink = `<a href="${event.target.result}" download="${file.name}" style="color: #10B981; text-decoration: underline; font-weight: bold;">📁 ${file.name}</a>`;
                    addChatMessage('Вы', `Отправлен файл: ${fileLink}`, '#10B981');
                } else {
                    alert('Ученик не подключен!');
                }
                e.target.value = ''; // очистка
            };
            reader.readAsDataURL(file);
        };

        // --- УПРАВЛЕНИЕ СЛАЙДАМИ ---
        function renderSlidesPanel() {
            const wrapper = document.getElementById('slidesWrapper');
            wrapper.innerHTML = '';
            slides.forEach((slide, index) => {
                const btn = document.createElement('button');
                btn.className = 'slide-btn ' + (index === currentSlideIndex ? 'active' : '');
                btn.innerText = 'Слайд ' + (index + 1);
                btn.onclick = () => switchSlide(index);
                wrapper.appendChild(btn);
            });
        }

        function switchSlide(index) {
            slides[currentSlideIndex] = serializeCurrentSlide();
            slides[currentSlideIndex].id = slides[currentSlideIndex].id || Date.now();
            currentSlideIndex = index;
            restoreSlideData(slides[currentSlideIndex]);
            historyStack = [slides[currentSlideIndex]];
            historyStep = 0;
            renderSlidesPanel();
            saveToLocalStorage();
        }

        document.getElementById('btnAddSlide').onclick = () => {
            slides[currentSlideIndex] = serializeCurrentSlide();
            slides.push({ id: Date.now(), drawing: '', draggables: [], bg: 'bg-lines' });
            switchSlide(slides.length - 1);
        };

        // КНОПКА УДАЛЕНИЯ СЛАЙДА
        document.getElementById('btnDeleteSlide').onclick = () => {
            if (slides.length <= 1) {
                alert("Это единственный слайд, его нельзя удалить! Вы можете просто очистить доску.");
                return;
            }
            if (confirm("Вы уверены, что хотите удалить текущий слайд?")) {
                slides.splice(currentSlideIndex, 1);
                currentSlideIndex = Math.max(0, currentSlideIndex - 1);
                restoreSlideData(slides[currentSlideIndex]);
                historyStack = [slides[currentSlideIndex]];
                historyStep = 0;
                renderSlidesPanel();
                saveToLocalStorage();
            }
        };

        // --- СОХРАНЕНИЕ / ПРЕСЕТЫ ---
        function saveToLocalStorage() {
            slides[currentSlideIndex] = serializeCurrentSlide();
            localStorage.setItem('boardExpertMaxFullBase', JSON.stringify(slides));
        }

        function loadApp() {
            const saved = localStorage.getItem('boardExpertMaxFullBase');
            if (saved) {
                try { slides = JSON.parse(saved); } catch(e) { console.error(e); }
            }
            switchSlide(0); 
        }

        document.getElementById('btnSavePreset').onclick = () => {
            slides[currentSlideIndex] = serializeCurrentSlide();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(slides));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            downloadAnchorNode.setAttribute("download", "lesson_preset.json");
            document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove();
        };

        document.getElementById('btnLoadPreset').onclick = () => document.getElementById('importFile').click();
        document.getElementById('importFile').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try { slides = JSON.parse(e.target.result); switchSlide(0); } 
                catch(err) { alert("Ошибка файла!"); }
            };
            reader.readAsText(file);
        };

        document.getElementById('btnSavePNG').addEventListener('click', () => {
            const instruction = document.querySelector('.instruction');
            if (instruction) instruction.style.display = 'none'; 
            
            html2canvas(document.getElementById('boardArea')).then(canvas => {
                const link = document.createElement('a'); 
                link.download = 'board_screenshot.png'; 
                link.href = canvas.toDataURL(); 
                link.click();
                if (instruction) instruction.style.display = 'block';
            }).catch(err => console.error("Ошибка скриншота: ", err));
        });

        // --- ВСТАВКА КАРТИНОК ИЗ БУФЕРА ОБМЕНА (Ctrl+V / Cmd+V) ---
        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file' && items[i].type.startsWith('image/')) {
                    const file = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        // Обертке добавлен display: flex, чтобы убрать скрытые отступы. Кружок уменьшен и прижат к углу.
                        const imgHtml = `<div class="img-resize-wrapper" style="position: relative; width: 100%; display: flex;">
                            <img src="${event.target.result}" style="width: 100%; border-radius: 6px; pointer-events: none; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                            <div class="resize-handle" style="position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; background: rgba(0,0,0,0.2); cursor: nwse-resize; z-index: 10; clip-path: polygon(100% 0, 100% 100%, 0 100%);"></div>
                        </div>`;
                        
                        const el = createDraggable('image', 'clipboard_image', 150, 150, '', imgHtml);
                        
                        // Полностью очищаем карточку от зеленой подложки, рамок и отступов
                        el.style.background = 'transparent';
                        el.style.border = 'none';
                        el.style.padding = '0';
                        el.style.boxShadow = 'none';
                        
                        // Удаляем заголовок карточки
                        const title = el.querySelector('h4');
                        if (title) title.remove();

                        // Удаляем красный крестик. Умный ластик все равно сможет удалить этот скриншот.
                        const closeBtn = el.querySelector('.close-btn');
                        if (closeBtn) closeBtn.remove();
                        
                        // Убираем внутренние отступы у контента
                        const content = el.querySelector('.content');
                        if (content) content.style.marginTop = '0';

                        el.style.maxWidth = 'none';
                        el.style.minWidth = '150px'; 
                        el.style.width = '350px'; 
                        
                        const handle = el.querySelector('.resize-handle');
                        
                        handle.addEventListener('mousedown', (mouseEvent) => {
                            mouseEvent.stopPropagation();
                            const startW = el.offsetWidth;
                            const startX = mouseEvent.clientX;
                            
                            const onMouseMove = (moveEvt) => {
                                const newW = startW + (moveEvt.clientX - startX);
                                if (newW > 150) el.style.width = newW + 'px'; 
                            };
                            
                            const onMouseUp = () => {
                                document.removeEventListener('mousemove', onMouseMove);
                                document.removeEventListener('mouseup', onMouseUp);
                                recordHistory();
                            };
                            
                            document.addEventListener('mousemove', onMouseMove);
                            document.addEventListener('mouseup', onMouseUp);
                        });
                        
                        recordHistory();
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        // --- ГАЛОЧКИ ДЛЯ ПРАВИЛ ---
        const ruleBuilderModal = document.getElementById('ruleBuilderModal');
        const ruleBuilderBody = document.getElementById('ruleBuilderBody');
        
        function openRuleBuilder(topicKey, x, y) {
            const data = grammarData[topicKey]; if(!data || !data.rule) return;
            const tempDiv = document.createElement('div'); tempDiv.innerHTML = data.rule;
            const detailsBlocks = tempDiv.querySelectorAll('details');
            if(detailsBlocks.length === 0) { createDraggable('rule', topicKey, x, y); recordHistory(); return; }
            
            ruleBuilderBody.innerHTML = '';
            detailsBlocks.forEach((details, index) => {
                const label = document.createElement('label'); label.className = 'rule-checkbox-label';
                label.innerHTML = `<input type="checkbox" checked value="${index}"> <span>${details.querySelector('summary').innerText.replace('▶', '').trim()}</span>`;
                ruleBuilderBody.appendChild(label);
            });
            document.getElementById('btnConfirmRuleBuild').onclick = () => {
                let finalHtml = '';
                Array.from(tempDiv.childNodes).forEach(node => { if(node.nodeName !== 'DETAILS') finalHtml += node.outerHTML || node.textContent; });
                ruleBuilderBody.querySelectorAll('input').forEach((cb, i) => { if(cb.checked) finalHtml += detailsBlocks[i].outerHTML; });
                createDraggable('rule', topicKey, x, y, '', finalHtml);
                ruleBuilderModal.classList.remove('active'); recordHistory();
            };
            ruleBuilderModal.classList.add('active');
        }

        document.getElementById('btnAddRule').addEventListener('click', () => {
            const topicKey = document.getElementById('topicSelector').value; if (topicKey === 'none') return;
            openRuleBuilder(topicKey, canvasContainer.clientWidth/2-150, 100);
        });
        
        document.getElementById('btnAddFormula').addEventListener('click', () => {
            const topicKey = document.getElementById('topicSelector').value; if (topicKey === 'none') return;
            createDraggable('formula', topicKey, canvasContainer.clientWidth/2-150, 100); recordHistory();
        });

        // ИНИЦИАЛИЗАЦИЯ
        window.onload = () => {
            // Подключаем модалку глаголов
            const btnVerbsModal = document.getElementById('btnVerbsModal');
            const verbsModal = document.getElementById('verbsModal');
            const closeVerbsModal = document.querySelector('#verbsModal .modal-close');
            const searchVerbs = document.getElementById('searchVerbs');
            const verbsTableBody = document.getElementById('verbsTableBody');

            function renderVerbsTable(filterText = '') {
                verbsTableBody.innerHTML = '';
                const lowerFilter = filterText.toLowerCase();
                const filtered = irregularVerbs.filter(v => v[0].toLowerCase().includes(lowerFilter) || v[1].toLowerCase().includes(lowerFilter) || v[2].toLowerCase().includes(lowerFilter) || v[3].toLowerCase().includes(lowerFilter));
                filtered.forEach(v => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><b>${v[0]}</b></td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td>`;
                    verbsTableBody.appendChild(tr);
                });
            }
            btnVerbsModal.addEventListener('click', () => { verbsModal.classList.add('active'); renderVerbsTable(); searchVerbs.value = ''; searchVerbs.focus(); });
            closeVerbsModal.addEventListener('click', () => verbsModal.classList.remove('active'));
            verbsModal.addEventListener('click', (e) => { if (e.target === verbsModal) verbsModal.classList.remove('active'); });
            searchVerbs.addEventListener('input', (e) => renderVerbsTable(e.target.value));

            // Запуск логики
            loadApp();
        };

    </script>
</body>
</html>
